<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>SafeNet Juniors</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>

<body class="mt-20
p-72 bg-gray-100">
  <h1 class="text-1xl font-bold ml-500 red ">Înregistrare</h1>

  <input id="username" placeholder="Username"><br>
  <input id="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="Parolă"><br>

  <select id="role">
    <option value="elev">Elev</option>
    <option value="profesor">Profesor</option>
  </select>
  <br>

  <button id="registerBtn">Înregistrează-te</button>

  <hr class="my-6">

  <h1 class="text-3xl font-bold mb-4">Login</h1>

  <input id="loginEmail" placeholder="Email"><br>
  <input id="loginPassword" type="password" placeholder="Parolă"><br>

  <button class="bg-green-300 red-200 text-4xl" id="loginBtn">Conectează-te</button>

  <script type="module" src="assets/js/main.js"></script>
</body>

</html>
