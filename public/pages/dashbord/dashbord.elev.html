<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Despre proiectul SafeNet Junior și scopul educațional pentru elevii claselor I–IV.">
    <meta name="keywords" content="SafeNet Junior, siguranță online, copii, proiect educațional, Cahul">
    <title>dashboard Elevi - SafeNet Junior</title>
    <link rel="stylesheet" href="../../assets/css/app.css">
    <link rel="icon" href="../../assets/img/Vector.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">

    <script>
        if (localStorage.getItem("tema") === "dark") {
            document.documentElement.classList.add("dark");
        }
    </script>
</head>

<body class="w-full  min-w-[375px] transition-colors duration-300 bg-white body  dark:bg-[#31344D] dark:text-white ">



    <!-- ----------------------------------------------- -->
    <!-- ----------------Header----------------------- -->
    <!-- ----------------------------------------------- -->

    <div class="sticky top-0 left-0 z-10 header"></div>


    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->


    <section
        class="background2 flex justify-center items-center flex-col pb-[150px]  pt-[80px] w-full mx-auto min-h-[100dvh] bg-cover bg-center bg-no-repeat"
        style=" background-image: url('../../assets/img/backgrounds/background-alb2..png');">







        <div class="w-full flex flex-col p-[32px]">

            <h2 class="mb-4 text-2xl font-semibold text-center text-black dark:text-[#EBF6FF] md:text-3xl">
                Clasele tale
            </h2>

            <div class="flex flex-col w-full">



                <div id="grila-clase"
                    class="w-[94%] mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 3xl:grid-cols-4 gap-[10px]">

                    <div id="card-adauga-clasa"
                        class="bg-[#1a1a18] dark:bg-[#1e2035] rounded-[30px] p-8 flex flex-col items-center justify-start gap-6 relative overflow-hidden transition-transform hover:scale-[1.02]">

                        <div
                            class="absolute top-[-60px] left-1/2 -translate-x-1/2 w-[280px] h-[280px] rounded-full bg-blue-600/10 blur-3xl pointer-events-none">
                        </div>

                        <div
                            class="w-full h-[160px] rounded-2xl flex justify-center items-center bg-[#252523] dark:bg-[#252840] border border-white/5">
                            <img src="../../assets/img/img-pt-index/User_Add-normalMode.svg" alt="Clase"
                                class="User_Add w-[35%] opacity-90 drop-shadow-lg">
                        </div>

                        <div class="text-center">
                            <h3 class="text-white font-extrabold text-xl tracking-tight">Alătură-te unei clase</h3>
                            <p class="text-gray-400 text-sm mt-1">Introdu codul primit de la profesor</p>
                        </div>

                        <div class="w-full flex flex-col gap-2">
                            <label class="text-gray-400 text-xs font-semibold uppercase tracking-widest pl-1">Cod
                                clasă</label>
                            <input id="input-cod-clasa" type="text" placeholder="Ex: B-RS4H"
                                class="w-full bg-[#2e2e2c] dark:bg-[#2d3050] border border-white/10 focus:border-blue-500 rounded-xl py-3 px-5 text-white text-center font-mono tracking-widest text-base focus:outline-none transition placeholder-gray-600" />
                        </div>

                        <button id="btn-adauga-clasa"
                            class="w-full py-3 rounded-xl bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold text-base tracking-wide transition active:scale-[0.98] shadow-lg shadow-blue-900/30 flex items-center justify-center gap-2">
                            <span>→</span> Alătură-te
                        </button>

                        <p id="msg-adauga-clasa" class="text-xs text-green-400 hidden -mt-3">✓ Te-ai alăturat cu succes!
                        </p>
                    </div>

                </div>
            </div>

        </div>
        </div>

    </section>



    <!-- ----------------------------------------------- -->
    <!-- --------------Footer---------------------- -->
    <!-- ----------------------------------------------- -->
    <div class="footer"></div>

    <!-- ------------------------------ ------------------------------------ -->
    <!-- ------------------------------Scripturi-------------------------------- -->
    <!-- ------------------------------------------------------------------------------->

    <!-- ---------------loading screen-------------- -->
    <script src="/public/assets/js/loading-srean.js"></script>


    <!-- ---------------genrearea de clase pentru elevi------------- -->

    <script type="module" src="../../assets/js/game-service/class-elevi-service.js"></script>


    <!-- ---------------autentificat-------------- -->
    <script type="module" src="/public/assets/js/dashboard/autentificat.js"></script>
    <!-- ---------------header / footer-------------- -->
    <script src="../../assets/js/materialHTML/materialHTML.js"></script>

    <!-- ---------------dashboard-------------- -->

    <script type="module" src="../../assets/js/dashboard/student-dashboard.js"></script>
</body>

</html>
