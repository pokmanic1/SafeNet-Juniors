<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Despre proiectul SafeNet Junior și scopul educațional pentru elevii claselor I–IV.">
    <meta name="keywords" content="SafeNet Junior, siguranță online, copii, proiect educațional, Cahul">
    <title>dashboard Elevi - SafeNet Junior</title>
    <link rel="stylesheet" href="../../assets/css/app.css">
    <link rel="icon" href="../../assets/img/Vector.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../assets/css/style.css">

    <script>
        if (localStorage.getItem("tema") === "dark") {
            document.documentElement.classList.add("dark");
        }
    </script>
</head>

<body class="w-full  min-w-[375px] transition-colors duration-300 bg-white body  dark:bg-[#31344D] dark:text-white ">



    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->

    <div class="sticky top-0 left-0 z-10 header"></div>


    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->


    <section
        class=" flex justify-center items-center flex-col pb-[150px]  pt-[80px] w-full mx-auto min-h-[100dvh] bg-cover bg-center bg-no-repeat"
        style=" background-image: url('../../assets/img/backgrounds/background-alb6..png');">




        <div class="w-full flex flex-col p-[32px]">
            <h1 class="mb-4 text-3xl font-bold text-center text-gray-900 md:text-4xl">
                Bun venit în dashboard-ul tău, elev!
            </h1>
            <p class="max-w-2xl mx-auto text-lg text-center text-gray-700 md:text-xl">
                Aici poți accesa jocurile și testele create de profesori pentru a învăța cum să fii în siguranță online.
                Explorează resursele
                și distrează-te în timp ce înveți!
            </p>
        </div>




        <div class="w-full flex flex-col p-[32px]">

            <h2 class="mb-4 text-2xl font-semibold text-center text-black md:text-3xl">
                Clasele tale
            </h2>

            <div class="flex flex-col w-full">

                <div class="w-[92%] flex justify-start items-center mb-[20px] mx-auto">
                    <h1 class="text-start font-semibold text-[24px]">Clasele Mele</h1>
                </div>

                <div id="grila-clase"
                    class="w-[94%] mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 3xl:grid-cols-4 gap-[10px]">

                    <div id="card-adauga-clasa"
                        class="border border-dashed border-gray-500 bg-[#30302E] rounded-2xl p-[20px] flex flex-col justify-center items-center gap-3 transition-transform hover:scale-[1.02] hover:bg-[#3a3a38]">

                        <p class="text-[#aaa] text-[16px] font-medium">Clasă nouă</p>
                        <p class="text-[#aaa] text-[14px] font-medium">Introdu codul clasei</p>

                        <input id="input-cod-clasa" type="text" placeholder="Ex: B-RS4H"
                            class="w-full border border-gray-600 bg-[#252523] px-3 py-2 rounded-xl text-white text-center text-[14px] focus:outline-none focus:border-blue-500 transition placeholder-gray-500" />

                        <button id="btn-adauga-clasa"
                            class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white text-[14px] font-semibold px-5 py-2 rounded-full transition active:scale-95">
                            <span class="text-[18px] ">+</span> Intra in clasa
                        </button>

                        <p id="msg-adauga-clasa" class="text-[12px] text-green-400 hidden"> </p>
                    </div>

                </div>
            </div>

        </div>

    </section>



    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->

    <div class="footer"></div>

    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->



    <script type="module" src="../../assets/js/game-service/class-elevi-service.js"></script>



    <!-- ---------------header / footer-------------- -->
    <script src="../../assets/js/materialHTML/materialHTML.js"></script>

    <!-- ---------------dashboard-------------- -->

    <script type="module" src="../../assets/js/dashboard/student-dashboard.js"></script>
</body>

</html>
