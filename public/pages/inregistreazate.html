                <div class="mb-4">

                    <p>

                        and

                    </p>
                </div> -->
                <div class="conectare_p flex items-center gap-2 text-sm text-red-600 mb-6 mt-6 ">

                </div>

                <div class="flex justify-center ">

    <!-- Footer -->

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        const iconOpen = document.getElementById('iconOpen');
        const iconClose = document.getElementById('iconClose');

        function setMenu(open) {
            mobileMenu.classList.toggle('hidden', !open);
            iconOpen.classList.toggle('hidden', open);
            iconClose.classList.toggle('hidden', !open);
            menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
        }

        menuBtn?.addEventListener('click', () => {
            const isOpen = !mobileMenu.classList.contains('hidden');
            setMenu(!isOpen);
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) setMenu(false);
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') setMenu(false);
        });
    </script>
    <script type="module" src='../assets/js/main.js'></script>
    <script type="module" src='../assets/js/utilizatori.js'></script>
    <script type="module" src="../assets/js/dashboard/student-dashboard.js"></script>
