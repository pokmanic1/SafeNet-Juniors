<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../../../assets/css/app.css">

      font-family: 'Inter', sans-serif;
    }

    .container {

      gap: 5px;
      width: 70%;
    }

    .card {
      transition: 0.4s ease-in-out;
      flex: 1;
    }

    .card:hover {
      flex: 2;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header class="sticky top-0 left-0 z-10 bg-white border-[1px] border-b border-gray-300">
    <div class="mx-[10px] md:mx-[30px] lg:mx-[40px] max-w-full px-6 py-3 flex items-center justify-between">

      <a href="../../../index.html" class="flex items-center gap-3">
        <img class="w-20 object-contain" src="../../../assets/img/Logo.svg" alt="SafeNet Junior">
      </a>

      <nav class="hidden md:flex items-center gap-12 font-semibold absolute left-1/2 transform -translate-x-1/2">
        <a class="hover:text-gray-700" href="../../games.html">Jocuri</a>
        <a class="hover:text-gray-700" href="../../assessment.html">Teste</a>
      </nav>

      <div class="hidden md:flex items-center gap-10 font-semibold">
        <a id="InregistreazataID" class="hover:text-gray-700" href="../../inregistreazate.html">Înregistrare</a>
        <a id="ConecteazataID" class="hover:text-gray-700" href="../../conecteazate.html">Conectare</a>
      </div>

      <button id="menuBtn"
        class="md:hidden inline-flex items-center justify-center rounded-xl p-2 text-gray-900 hover:bg-gray-100 transition"
        aria-label="Deschide meniul" aria-controls="mobileMenu" aria-expanded="false">
        <svg id="iconOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>

        <svg id="iconClose" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div id="mobileMenu" class="md:hidden hidden border-t border-gray-200 bg-white">
      <div class="mx-auto max-w-7xl px-6 py-4 space-y-3 font-semibold">

        <a class="block py-2 hover:text-gray-700" href="../../games.html">Jocuri</a>
        <a class="block py-2 hover:text-gray-700" href="../../assessment.html">Teste</a>

        <div class="h-px bg-gray-200 my-2"></div>

        <a id="InregistreazataID_M" class="block py-2 hover:text-gray-700" href="../../inregistreazate.html">
          Înregistrare
        </a>
        <a id="ConecteazataID_M" class="block py-2 hover:text-gray-700" href="../../conecteazate.html">
          Conectare
        </a>
      </div>
    </div>
  </header>



  <div class="min-h-[90dvh] flex flex-col justify-center items-center px-4 py-12">
    <div
      class="w-full max-w-2xl bg-white rounded-3xl card-shadow p-8 md:p-12 border border-slate-100 text-center shadow-xl">

      <div class="mb-10">
        <span
          class="bg-blue-50 text-blue-600 text-xs font-bold uppercase tracking-widest px-4 py-1.5 rounded-full">Panou
          Profesor</span>
        <h1 class="text-3xl md:text-4xl font-bold mt-4 text-slate-900">Configurare Joc True / False</h1>
        <p id="progres" class="text-slate-500 mt-2 italic">Stabilește întrebările pentru elevi</p>
      </div>

      <div id="pasul1" class="flex flex-col items-center space-y-6">
        <div class="w-full max-w-sm">
          <input id="nume_joc" type="text" placeholder="Numele jocului"
            class="w-full border-2 border-slate-100 rounded-2xl px-6 py-4 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition-all text-center text-lg font-medium bg-slate-50">
        </div>
        <div class="w-full max-w-sm">
          <input id="nr_intrebari" type="number" min="1" max="10" placeholder="Câte întrebări dorești? (1-10)"
            class="w-[80%] border-2 border-slate-100 rounded-2xl px-6 py-4 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition-all text-center text-lg font-medium bg-slate-50">
        </div>

        <button id="btn_incepe"
          class="group relative bg-slate-900 text-white px-10 py-4 rounded-2xl font-bold text-lg hover:bg-blue-600 transition-all hover:shadow-2xl hover:shadow-blue-200 active:scale-95">
          Începe configurarea
        </button>
      </div>

      <div id="pasul2" class="hidden flex flex-col items-center space-y-6">
        <h2 id="titlu_pas" class="text-xl font-semibold text-blue-800 bg-blue-50 px-6 py-2 rounded-full">Introdu
          întrebarea 1</h2>

        <div class="w-full space-y-4 text-left">
          <label class="text-sm font-bold text-slate-400 ml-2 uppercase">Afirmația</label>
          <input type="text" id="text_intrebare" placeholder="Scrie aici afirmația..."
            class="w-full border-2 border-slate-100 rounded-2xl px-6 py-4 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition-all bg-slate-50">

          <label class="text-sm font-bold text-slate-400 ml-2 uppercase">Răspunsul Corect</label>
          <select id="raspuns_corect"
            class="w-full border-2 border-slate-100 rounded-2xl px-6 py-4 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition-all bg-slate-50 font-medium appearance-none">
            <option value="" disabled selected>Alege răspunsul...</option>
            <option value="true">Adevărat (True)</option>
            <option value="false">Fals (False)</option>
          </select>
        </div>
        <div>
          <div class="flex flex-col sm:flex-row gap-4 w-full justify-center pt-4">
            <button id="btn_adauga"
              class="bg-blue-600 text-white px-8 py-4 rounded-2xl font-bold hover:bg-blue-700 transition-all shadow-lg shadow-blue-200">
              Adaugă Întrebarea
            </button>
            <button id="btn_restart"
              class="bg-red-500 text-white px-10 py-4 rounded-xl font-bold text-lg hover:bg-red-600 transition shadow-lg shadow-red-200">
              Restartează Tot
            </button>
          </div>
          <p id="mesajEroareTF" class="font-semibold text-center mt-4 hidden"></p>
        </div>
      </div>
    </div>
  </div>



























  <script type="module">
    import { salveazaJocTrueFalse } from "../../../assets/js/game-service/teachers-create-game-tuefalse.js";

    let arrIntrebariProfesor = [];
    let numarTotal = 0;
    let toateIntrebarile = JSON.parse(localStorage.getItem("toate_jocTrueFalse")) || [];
    const nume_joc = document.getElementById("nume_joc");
    const inputNr = document.getElementById("nr_intrebari");
    const btnIncepe = document.getElementById("btn_incepe");
    const pasul1 = document.getElementById("pasul1");
    const pasul2 = document.getElementById("pasul2");

    const inputText = document.getElementById("text_intrebare");
    const inputRaspuns = document.getElementById("raspuns_corect");
    const btnAdauga = document.getElementById("btn_adauga");
    const btnRestart = document.getElementById("btn_restart");

    const titluPas = document.getElementById("titlu_pas");
    const progresText = document.getElementById("progres");

    function afiseazaMesajTF(text, culoare, timp = 2000) {

      const mesaj = document.getElementById("mesajEroareTF");

      mesaj.innerText = text;
      mesaj.classList.remove("hidden");
      mesaj.classList.add(culoare);

      setTimeout(() => {
        mesaj.classList.add("hidden");
        mesaj.innerText = "";
      }, timp);

    }

    btnIncepe.addEventListener("click", () => {
      numarTotal = parseInt(inputNr.value);

      if (numarTotal > 0 && numarTotal <= 10) {
        pasul1.classList.add("hidden");
        pasul2.classList.remove("hidden");
        actualizeazaInterfata();
      } else {
        afiseazaMesajTF("Te rugăm să introduci un număr între 1 și 10.", 'text-red-500');
      }
    });

    btnAdauga.addEventListener("click", async() => {
      const textValue = inputText.value.trim();
      const raspunsValue = inputRaspuns.value;

      if (!textValue) {
        afiseazaMesajTF("Te rugăm să scrii textul întrebării!", 'text-red-500');

        return;
      }
      if (!raspunsValue) {
        afiseazaMesajTF("Te rugăm să alegi dacă este Adevărat sau Fals!", 'text-red-500');

        return;
      }

      const obiectIntrebare = {
        text: textValue,
        raspuns: raspunsValue === "true"
      };

      const duplicat = arrIntrebariProfesor.some(q => q.text.toLowerCase() === textValue.toLowerCase());
      if (duplicat) {

        afiseazaMesajTF("Această întrebare a fost deja adăugată!", 'text-red-500');

        return;
      }
      arrIntrebariProfesor.push(obiectIntrebare);

      localStorage.setItem("intrebariTrueFalse", JSON.stringify(arrIntrebariProfesor));




      inputText.value = "";
      inputRaspuns.selectedIndex = 0;

      if (arrIntrebariProfesor.length < numarTotal) {
        actualizeazaInterfata();
      } else {

        afiseazaMesajTF("Felicitări! Ai configurat toate întrebările. Acum poți merge la joc.", 'text-green-500');
        btnAdauga.disabled = true;
        btnAdauga.classList.add("opacity-50", "cursor-not-allowed");

        const joc = {
          nume: nume_joc.value,
          tip: "true-false",
          intrebari: [...arrIntrebariProfesor]
        };
        await salveazaJocTrueFalse(joc);
        console.log("Joc salvat:", joc);

      }
    });

    btnRestart.addEventListener("click", () => {
      arrIntrebariProfesor = [];
      localStorage.removeItem("intrebariTrueFalse");
      location.reload();
    });

    function actualizeazaInterfata() {
      titluPas.textContent = `Introdu întrebarea ${arrIntrebariProfesor.length + 1}`;
      progresText.textContent = `Întrebări adăugate: ${arrIntrebariProfesor.length} / ${numarTotal}`;
    }
  </script>

  <script>
    const menuBtn = document.getElementById('menuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    const iconOpen = document.getElementById('iconOpen');
    const iconClose = document.getElementById('iconClose');

    function setMenu(open) {
      mobileMenu.classList.toggle('hidden', !open);
      iconOpen.classList.toggle('hidden', open);
      iconClose.classList.toggle('hidden', !open);
      menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    menuBtn.addEventListener('click', () => {
      const isOpen = !mobileMenu.classList.contains('hidden');
      setMenu(!isOpen);
    });

    // Închide meniul când se schimbă la desktop
    window.addEventListener('resize', () => {
      if (window.innerWidth >= 768) setMenu(false);
    });

    // Închide meniul când se apasă Escape
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') setMenu(false);
    });
  </script>


  <script type="module" src="../../../assets/js/game-service/teachers-create-game-tuefalse.js"></script>
  <script type="module" src="../../../assets/js/dashboard/student-dashboard.js"></script>
</body>

</html>
