      font-family: 'Inter', sans-serif;

      display: flex;

    .card {

    }

      cursor: pointer;
    }

<body>

  <header class="sticky top-0 left-0 z-10 bg-white border-[1px] border-b border-gray-300">
    <div class="mx-[10px] md:mx-[30px] lg:mx-[40px] max-w-full px-6 py-3 flex items-center justify-between">

      <a href="../../../index.html" class="flex items-center gap-3">
        <img class="object-contain w-20" src="../../../assets/img/Logo.svg" alt="SafeNet Junior">
      </a>

      <nav class="absolute items-center hidden gap-12 font-semibold transform -translate-x-1/2 md:flex left-1/2">
        <a class="hover:text-gray-700" href="../../games.html">Jocuri</a>
        <a class="hover:text-gray-700" href="../../assessment.html">Teste</a>
      </nav>

      <div class="items-center hidden gap-10 font-semibold md:flex">
        <a id="InregistreazataID" class="hover:text-gray-700" href="../../inregistreazate.html">Înregistrare</a>
        <a id="ConecteazataID" class="hover:text-gray-700" href="../../conecteazate.html">Conectare</a>
      </div>

      <button id="menuBtn"
        class="inline-flex items-center justify-center p-2 text-gray-900 transition md:hidden rounded-xl hover:bg-gray-100"
        aria-label="Deschide meniul" aria-controls="mobileMenu" aria-expanded="false">
        <svg id="iconOpen" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>

        <svg id="iconClose" xmlns="http://www.w3.org/2000/svg" class="hidden w-6 h-6" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div id="mobileMenu" class="hidden bg-white border-t border-gray-200 md:hidden">
      <div class="px-6 py-4 mx-auto space-y-3 font-semibold max-w-7xl">

        <a class="block py-2 hover:text-gray-700" href="../../games.html">Jocuri</a>
        <a class="block py-2 hover:text-gray-700" href="../../assessment.html">Teste</a>

        <div class="h-px my-2 bg-gray-200"></div>

        <a id="InregistreazataID_M" class="block py-2 hover:text-gray-700" href="../../inregistreazate.html">
          Înregistrare
        </a>
        <a id="ConecteazataID_M" class="block py-2 hover:text-gray-700" href="../../conecteazate.html">
          Conectare
        </a>
      </div>
    </div>
  </header>



  <div class="min-h-[90dvh] flex flex-col justify-center items-center px-4 py-12">
    <div
      class="w-full max-w-2xl p-8 text-center bg-white border shadow-xl rounded-3xl card-shadow md:p-12 border-slate-300">

      <div class="mb-10">
        <span
          class="bg-blue-50 text-blue-600 text-xs font-bold uppercase tracking-widest px-4 py-1.5 rounded-full">Panou
          Profesor</span>
        <h1 class="mt-4 text-3xl font-bold md:text-4xl text-slate-900">Configurare Joc True / False</h1>
        <p class="mt-0 italic text-slate-500">Stabilește numele si numărul de întrebări pentru elevi</p>
      </div>

      <div id="pasul1" class="flex flex-col items-center space-y-6">
        <div class="w-full max-w-sm">
          <input id="nume_joc" type="text" placeholder="Numele jocului"
            class="w-full px-6 py-4 text-lg font-medium text-center transition-all border-2 shadow-xl outline-none border-slate-100 rounded-2xl focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 bg-slate-50">
        </div>
        <div class="w-full max-w-sm">
          <input id="nr_intrebari" type="number" min="1" max="10" placeholder="Câte întrebări dorești? (1-10)"
            class="w-[80%] border-2 border-slate-100 rounded-2xl px-6 py-4 shadow-xl focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition-all text-center text-lg font-medium bg-slate-50">
        </div>

        <button id="btn_incepe"
          class="relative px-10 py-4 text-lg font-bold text-white transition-all group bg-slate-900 rounded-2xl hover:bg-blue-600 hover:shadow-2xl hover:shadow-blue-200 active:scale-95">
          Începe configurarea
        </button>
      </div>

      <div id="pasul2" class="flex flex-col items-center hidden space-y-6">

        <h2 id="titlu_pas" class="px-6 py-2 text-xl font-semibold text-blue-800 rounded-full bg-blue-50">Configurează
          întrebarea 1</h2>

        <div class="w-full space-y-4 text-left">
          <label class="ml-2 text-sm font-bold uppercase text-slate-400">Afirmația</label>
          <input type="text" id="text_intrebare" placeholder="Scrie aici afirmația..."
            class="w-full px-6 py-4 transition-all border-2 outline-none border-slate-100 rounded-2xl focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 bg-slate-50">

          <label class="ml-2 text-sm font-bold uppercase text-slate-400">Răspunsul Corect</label>
          <select id="raspuns_corect"
            class="w-full px-6 py-4 font-medium transition-all border-2 outline-none appearance-none border-slate-100 rounded-2xl focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 bg-slate-50">
            <option value="" disabled selected>Alege răspunsul...</option>
            <option value="true">Adevărat (True)</option>
            <option value="false">Fals (False)</option>
          </select>
        </div>
        <div class="flex flex-col items-center ">
          <div class="flex flex-col justify-center w-full gap-4 pt-4 sm:flex-row">
            <button id="btn_adauga"
              class="px-8 py-4 font-bold text-white transition-all bg-blue-600 shadow-lg rounded-2xl hover:bg-blue-700 shadow-blue-200">
              Adaugă Întrebarea
            </button>
            <button id="btn_restart"
              class="px-8 py-4 text-lg font-bold text-white transition bg-red-500 shadow-lg rounded-xl hover:bg-red-600 shadow-red-200">
              Restartează Tot
            </button>
          </div>
                <a href="./true-false-game.html" id="btn_mergilajoc"
                  class="hidden px-8 py-4 mt-4 text-lg font-bold text-white transition bg-green-500 shadow-lg btnMergiLaJoc rounded-xl hover:bg-green-600 shadow-green-200">
                  Mergi la joc</a>
              
              <p id="mesajEroareTF" class="hidden mt-4 font-semibold text-center"></p>
        </div>
      </div>
    </div>
  </div>












  <script type="module">
    import { salveazaJocTrueFalse } from "../../../assets/js/game-service/teachers-create-game-tuefalse.js";

    let arrIntrebariProfesor = [];
    let numarTotal = 0;
    let toateIntrebarile = JSON.parse(localStorage.getItem("toate_jocTrueFalse")) || [];
    const nume_joc = document.getElementById("nume_joc");
    const inputNr = document.getElementById("nr_intrebari");
    const btnIncepe = document.getElementById("btn_incepe");
    const pasul1 = document.getElementById("pasul1");
    const pasul2 = document.getElementById("pasul2");

    const inputText = document.getElementById("text_intrebare");
    const inputRaspuns = document.getElementById("raspuns_corect");
    const btnAdauga = document.getElementById("btn_adauga");
    const btnRestart = document.getElementById("btn_restart");

    const titluPas = document.getElementById("titlu_pas");
    const progresText = document.getElementById("progres");

    function afiseazaMesajTF(text, culoare, timp = 2000) {

      const mesaj = document.getElementById("mesajEroareTF");

      mesaj.innerText = text;
      mesaj.classList.remove("hidden");
      mesaj.classList.add(culoare);

      setTimeout(() => {
        mesaj.classList.add("hidden");
        mesaj.innerText = "";
      }, timp);

    }

    btnIncepe.addEventListener("click", () => {
      numarTotal = parseInt(inputNr.value);

      if (numarTotal > 0 && numarTotal <= 10) {
        pasul1.classList.add("hidden");
        pasul2.classList.remove("hidden");
        actualizeazaInterfata();
      } else {
        afiseazaMesajTF("Te rugăm să introduci un număr între 1 și 10.", 'text-red-500');
      }
    });

    btnAdauga.addEventListener("click", async () => {
      const textValue = inputText.value.trim();
      const raspunsValue = inputRaspuns.value;

      if (!textValue) {
        afiseazaMesajTF("Te rugăm să scrii textul întrebării!", 'text-red-500');

        return;
      }
      if (!raspunsValue) {
        afiseazaMesajTF("Te rugăm să alegi dacă este Adevărat sau Fals!", 'text-red-500');

        return;
      }

      const obiectIntrebare = {
        text: textValue,
        raspuns: raspunsValue === "true"
      };

      const duplicat = arrIntrebariProfesor.some(q => q.text.toLowerCase() === textValue.toLowerCase());
      if (duplicat) {

        afiseazaMesajTF("Această întrebare a fost deja adăugată!", 'text-red-500');

        return;
      }
      arrIntrebariProfesor.push(obiectIntrebare);





      inputText.value = "";
      inputRaspuns.selectedIndex = 0;

      if (arrIntrebariProfesor.length < numarTotal) {
        actualizeazaInterfata();
      } else {

        afiseazaMesajTF("Felicitări! Ai configurat toate întrebările. Acum poți merge la joc.", 'text-green-500');
        document.querySelector(".btnMergiLaJoc").classList.remove("hidden");
        console.log('-------------------------------------------------');
        console.log('-------------------------------------------------');
        console.log('-----------sssssssssssssssssssss-----------------');
        console.log("Întrebări adăugate:", arrIntrebariProfesor);
        localStorage.setItem("intrebariTrueFalse", JSON.stringify(arrIntrebariProfesor));


        btnAdauga.disabled = true;
        btnAdauga.classList.add("opacity-50", "cursor-not-allowed");

        const joc = {
          nume: nume_joc.value,
          tip: "true-false",
          intrebari: [...arrIntrebariProfesor]
        };
        await salveazaJocTrueFalse(joc);
        console.log("Joc salvat:", joc);

      }
    });

    btnRestart.addEventListener("click", () => {
      arrIntrebariProfesor = [];
      localStorage.removeItem("intrebariTrueFalse");
      location.reload();
    });

    function actualizeazaInterfata() {
      titluPas.textContent = `Configurează întrebarea ${arrIntrebariProfesor.length + 1}`;
      progresText.textContent = `Întrebări adăugate: ${arrIntrebariProfesor.length} / ${numarTotal}`;
    }
  </script>



  <script type="module" src="../../../assets/js/game-service/teachers-create-game-tuefalse.js"></script>
  <script type="module" src="../../../assets/js/dashboard/student-dashboard.js"></script>
</body>

</html>
