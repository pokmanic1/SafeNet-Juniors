<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>True / False Game</title>

    <style>
        .corect {
    transform: scale(1.25);
    background-color: #22c55e;
    transition: transform 0.3s ease;
        }
    </style>


</head>

<body class="h-[100dvh] w-full bg-cover bg-center bg-no-repeat"
    style="background-image: url('../../../assets/img/backgrounds/Abackground.png');">

    <header class="w-full bg-white">
        <div class="mx-auto max-w-7xl px-6 py-3 flex items-center justify-between">

            <a href="../../../index.html" class="flex items-center gap-3">
                <img class="w-20 object-contain" src="../../../assets/img/image-removebg-preview (5).png"
                    alt="SafeNet Junior">
            </a>

            <nav class="hidden md:flex items-center gap-12 font-semibold">
                <a class="hover:text-gray-700" href="../../games.html">Jocuri</a>
                <a class="hover:text-gray-700" href="../../assessment.html">Teste</a>
            </nav>

            <div class="hidden md:flex items-center gap-10 font-semibold">
                <a id="InregistreazataID" class="hover:text-gray-700" href="../../inregistreazate.html">Înregistrare</a>
                <a id="ConecteazataID" class="hover:text-gray-700" href="../../conecteazate.html">Conectare</a>
            </div>

            <button id="menuBtn"
                class="md:hidden inline-flex items-center justify-center rounded-xl p-2 text-gray-900 hover:bg-gray-100 transition"
                aria-label="Deschide meniul" aria-controls="mobileMenu" aria-expanded="false">
                <svg id="iconOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>

                <svg id="iconClose" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div id="mobileMenu" class="md:hidden hidden border-t border-gray-200 bg-white">
            <div class="mx-auto max-w-7xl px-6 py-4 space-y-3 font-semibold">

                <a class="block py-2 hover:text-gray-700" href="../../games.html">Jocuri</a>
                <a class="block py-2 hover:text-gray-700" href="../../assessment.html">Teste</a>

                <div class="h-px bg-gray-200 my-2"></div>

                <a id="InregistreazataID_M" class="block py-2 hover:text-gray-700" href="../../inregistreazate.html">
                    Înregistrare
                </a>
                <a id="ConecteazataID_M" class="block py-2 hover:text-gray-700" href="../../conecteazate.html">
                    Conectare
                </a>
            </div>
        </div>
    </header>

    <div class="container flex flex-col items-center justify-center h-[90dvh] gap-16">

        <div class="flex items-center gap-6">

            <select
                class="nivelul w-[160px] text-center bg-blue-200 text-black font-medium px-5 py-3 rounded-full shadow-md cursor-pointer">
                <option value="1" class="text-gray-700">Nivelul 1</option>
                <option value="2" class="text-black">Nivelul 2</option>
                <option value="3" class="text-black">Nivelul 3</option>
                <option value="4" class="text-black">Nivelul 4</option>
            </select>

            <div
                class="time w-[160px] flex justify-center items-center bg-blue-200 px-5 py-3 rounded-full shadow-md font-medium">
                time
            </div>

            <div
                class="scorul w-[160px] flex justify-center items-center bg-blue-200 px-5 py-3 rounded-full shadow-md font-medium">
                Scor: 0
            </div>

            <button
                class="restart w-[50px] h-[50px] flex items-center justify-center bg-blue-200 rounded-full shadow-md text-xl">
                <img class="w-[60%] " src="../../../assets/img/img-shufle-game/A-buton-restart.png" alt="">
            </button>

        </div>

        <div class="relative flex flex-col items-center">

            <div class="absolute -top-6 left-0 bg-blue-300 px-6 py-2 rounded-full text-sm shadow-md">
                <span class="nrIntrebare">Întrebarea: 1</span>
            </div>

            <div class="mt-4 w-[650px] max-w-[90vw] bg-blue-300 rounded-[40px] py-10 px-8 text-center shadow-lg">
                <h2 class="textIntrebare text-2xl font-medium">
                    O parolă puternică conține 4 caractere
                </h2>
            </div>

        </div>

        <div class="flex justify-between w-[700px] max-w-[90vw] mt-10">

            <button
                class="raspuns w-[220px] h-[70px] bg-green-500 hover:bg-green-600 text-black font-semibold text-xl rounded-[20px] shadow-lg"
                id="true">
                Adevarat
            </button>

            <button
                class="raspuns w-[220px] h-[70px] bg-red-500 hover:bg-red-600 text-black font-semibold text-xl rounded-[20px] shadow-lg"
                id="false">
                Fals
            </button>

            <button
                class="restart hidden w-[220px] h-[70px] bg-red-500 hover:bg-red-600 text-black font-semibold text-xl rounded-[20px] shadow-lg">
                restart
            </button>

        </div>

    </div>

    <script type="module" src="../../../assets/js/dashboard/student-dashboard.js"></script>
    <script type="module" src="../../../assets/js/modules/true-false-game.js"></script>
</body>

</html>
