<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <script src="https://cdn.tailwindcss.com"></script>

        <style>
            .card {
    width: 100px;
    height: 100px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s;
    cursor: pointer;
}

.front, .back {
    width: 100%;
    height: 100%;
    position: absolute;
    backface-visibility: hidden;
}

.front {
    background-color: #ccc;
}

.back {
    transform: rotateY(180deg);
    background-size: cover;
    background-position: center;
}

            .card.flipped{
                transform: rotateY(180deg);
            }
          .card.matched .front {
    background-color: #4ade80;
    box-shadow: 0 0 10px green;
    cursor: default;
}

        </style>


</head>

<body class="flex justify-center items-center h-[100dvh ]  m-0 font-serif">
    <div class="container flex justify-center items-center flex-col h-[100dvh]">
        <div class="joc grid grid-cols-[repeat(4,100px)] gap-4">
            
        </div>
    </div>

    <script src="../../assets/js/modules/shuffle.js"></script>
</body>

</html>
