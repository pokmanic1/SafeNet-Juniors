  <div class="w-full min-h-screen flex flex-col justify-center items-center bg-slate-100 border-slate-300 py-16 px-6">

    <div class="w-full max-w-6xl bg-white rounded-3xl shadow-xl border border-slate-200 p-10">
      <div class="flex w-full flex-col items-center ">
        <div class="text-center mb-10">
          <span
            class="bg-blue-50 text-blue-600 text-xs font-bold uppercase tracking-widest px-4 py-1.5 rounded-full">Panou
            Profesor</span>

          <p class="text-slate-500 mt-2">Adaugă perechi imagine + cuvânt pentru jocul elevilor</p>
        </div>

        <div class="w-full max-w-sm">
          <input id="nume_joc" type="text" placeholder="Numele jocului"

        </div>
      </div>


      <div id="formular-perechi" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8 mt-[30px]">

        <script>
          for (let i = 1; i <= 8; i++) {
            document.write(`
                        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 shadow-sm hover:shadow-md transition">

                            <label class="font-bold text-slate-800 mb-3 block">
                                Perechea ${i}
                            </label>

                            <input 
                                type="text" 
                                id="cuvant-${i}" 
                                placeholder="Introdu cuvântul..."
                                class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 mb-4 focus:border-blue-500 focus:ring-4 focus:ring-blue-200 outline-none transition"
                            >

                            <input 
                                type="file" 
                                id="imagine-${i}" 
                                accept="image/*"
                                class="w-full text-sm file:bg-blue-600 file:text-white file:px-4 file:py-2 file:rounded-lg file:border-none hover:file:bg-blue-700 cursor-pointer"
                            >

                        </div>
                    `);
          }
        </script>

      </div>

      <div class="mt-12 flex flex-col justify-center items-center gap-6">
        <div class="flex flex-col md:flex-row justify-center items-center gap-6">
          <button id="btn_salveaza_shuffle"
            class="bg-blue-600 text-white px-8 py-4 rounded-2xl font-bold hover:bg-blue-700 transition-all shadow-lg shadow-blue-200">
            Salvează Jocul
          </button>

          <button onclick="location.reload()"

            Resetează Tot
          </button>

        </div>
        <a href="./shuffle-game.html" id="btn_mergilajoc"
          class="btnMergiLaJoc hidden bg-green-500 text-white  mt-1 px-8 py-4 rounded-xl font-bold text-lg hover:bg-green-600 transition shadow-lg shadow-green-200">
          Mergi la joc</a>

        <p id="mesajEroareShuffle" class=" font-semibold text-center mt-6 hidden"></p>
      </div>

  </div>

  <!-- <div class="mt-8 flex gap-4">
    <button id="btn_salveaza_shuffle"
      class="bg-green-600 text-white px-10 py-3 rounded-lg font-bold hover:bg-green-700">
      Salvează Jocul

    <button onclick="location.reload()" class="bg-red-500 text-white px-10 py-3 rounded-lg font-bold">

  </div>






  <script type="module">
    import { salveazaJocShufle } from '../../../assets/js/game-service/teachers-create-game-shufle.js'

    let toateIntrebarile = JSON.parse(localStorage.getItem("toate_jocShuffle")) || [];

    const nume_joc = document.getElementById("nume_joc");
    document.getElementById('btn_salveaza_shuffle').addEventListener('click', async () => {

      function afiseazaMesajShuffle(text, culoare, timp = 2000) {

        const mesaj = document.getElementById("mesajEroareShuffle");

        mesaj.innerText = text;
        mesaj.classList.remove("hidden");
        mesaj.classList.add(culoare);

        setTimeout(() => {
          mesaj.classList.add("hidden");
          mesaj.innerText = "";
        }, timp);
      }

      let finalArray = [];

      for (let i = 1; i <= 8; i++) {

        const cuvant = document.getElementById(`cuvant-${i}`).value.trim();
        const fileInput = document.getElementById(`imagine-${i}`).files[0];

        if (!cuvant || !fileInput) {
          afiseazaMesajShuffle(`Te rugăm să completezi perechea ${i}!`, 'text-red-500');
          return;
        }

        const base64Image = await convertBase64(fileInput);

        finalArray.push({
          id: i,
          type: "text",
          value: cuvant
        });

        finalArray.push({
          id: i,
          type: "image",
          value: cuvant,
          imaginea: base64Image
        });
      }

      finalArray.sort(() => Math.random() - 0.5);

      localStorage.setItem("shuffleGameData", JSON.stringify(finalArray));
      //
      document.getElementById('btn_salveaza_shuffle').disabled = true;
      document.getElementById('btn_salveaza_shuffle').classList.add("opacity-50", "cursor-not-allowed");;
      document.querySelector(".btnMergiLaJoc").classList.remove("hidden");
      console.log(finalArray);

      const joc = {
        nume: nume_joc.value,
        tip: "shuffle",
        date: finalArray
      };

      toateIntrebarile.push(joc);
      await salveazaJocShufle(joc);
      console.log("Joc salvat:", joc);
    });

    function convertBase64(file) {
      return new Promise((resolve, reject) => {
        const fileReader = new FileReader();
        fileReader.readAsDataURL(file);
        fileReader.onload = () => resolve(fileReader.result);
        fileReader.onerror = (error) => reject(error);
      });
    }
  </script>






  <script>
    const menuBtn = document.getElementById('menuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    const iconOpen = document.getElementById('iconOpen');
    const iconClose = document.getElementById('iconClose');

    function setMenu(open) {
      mobileMenu.classList.toggle('hidden', !open);
      iconOpen.classList.toggle('hidden', open);
      iconClose.classList.toggle('hidden', !open);
      menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    menuBtn.addEventListener('click', () => {
      const isOpen = !mobileMenu.classList.contains('hidden');
      setMenu(!isOpen);
    });

    // Închide meniul când se schimbă la desktop
    window.addEventListener('resize', () => {
      if (window.innerWidth >= 768) setMenu(false);
    });

    // Închide meniul când se apasă Escape
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') setMenu(false);
    });
  </script>

  <script type="module" src="../../../assets/js/game-service/teachers-create-game-shufle.js"></script>
  <script type="module" src="../../../assets/js/dashboard/student-dashboard.js"></script>
