<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profesori - Potrivește Perechile</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="icon" href="/assets/img/Vector.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">

</head>

<body
  class="background1 w-full min-w-[375px] transition-colors duration-300 bg-white body  dark:bg-[#31344D] dark:text-white ">

  <!-- ----------------------------------------------- -->
  <!-- ----------------Header----------------------- -->
  <!-- ----------------------------------------------- -->
  <div class="sticky top-0 left-0 z-10 header"></div>



  <!-- ----------------------------------------------- -->
  <!-- ----------------------------------------------- -->
  <!-- ----------------------------------------------- -->


  <div
    class="flex flex-col items-center justify-center w-full min-h-screen px-6 py-16 bg-slate-100 dark:bg-[#2a2c3e] border-slate-300">

    <div
      class="w-full max-w-6xl p-10 bg-white dark:bg-[#3d4060]/90 border shadow-xl rounded-3xl border-slate-200 dark:border-[#EBF6FF]/10">
      <div class="flex flex-col items-center w-full ">
        <div class="mb-10 text-center">
          <span
            class="bg-blue-50 text-blue-600 text-xs font-bold uppercase tracking-widest px-4 py-1.5 rounded-full">Panou
            Profesor</span>
          <h1 class="mt-4 text-4xl font-bold text-slate-900 dark:text-[#EBF6FF]">Configurare Joc Shuffle</h1>
          <p class="mt-2 text-slate-500 dark:text-[#EBF6FF]/80">Adaugă perechi imagine + cuvânt pentru jocul elevilor
          </p>
        </div>

        <div class="w-full max-w-sm">
          <input id="nume_joc" type="text" placeholder="Numele jocului"
            class="w-full px-6 py-4 text-lg font-medium text-center transition-all border-2 shadow-xl outline-none border-slate-300 dark:border-[#EBF6FF]/10 rounded-2xl focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 bg-slate-50 dark:bg-[#2a2c3e] dark:text-[#EBF6FF]">
        </div>
      </div>


      <div id="formular-perechi" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8 mt-[30px]">

        <script>
          for (let i = 1; i <= 8; i++) {
            document.write(`
                        <div class="p-6 transition border shadow-sm bg-slate-50 dark:bg-[#2a2c3e] border-slate-200 dark:border-[#EBF6FF]/10 rounded-2xl hover:shadow-md">

                            <label class="block mb-3 font-bold text-slate-800 dark:text-[#EBF6FF]">
                                Perechea ${i}
                            </label>

                            <input 
                                type="text" 
                                id="cuvant-${i}" 
                                placeholder="Introdu cuvântul..."
                                class="w-full px-4 py-3 mb-4 transition border-2 outline-none border-slate-200 dark:border-[#EBF6FF]/10 rounded-xl focus:border-blue-500 focus:ring-4 focus:ring-blue-200 dark:bg-[#3d4060] dark:text-[#EBF6FF] dark:placeholder-[#EBF6FF]/40"
                            >

                            <input 
                                type="file" 
                                id="imagine-${i}" 
                                accept="image/*"
                                class="w-full text-sm cursor-pointer file:bg-blue-600 file:text-white file:px-4 file:py-2 file:rounded-lg file:border-none hover:file:bg-blue-700 dark:text-[#EBF6FF]/80"
                            >

                        </div>
                    `);
          }
        </script>

      </div>

      <div class="flex flex-col items-center justify-center gap-6 mt-12">
        <div class="flex flex-col items-center justify-center gap-6 md:flex-row">
          <button id="btn_salveaza_shuffle"
            class="px-8 py-4 font-bold text-white transition-all bg-blue-600 dark:hover:bg-blue-900 dark:bg-blue-800 shadow-lg rounded-2xl hover:bg-blue-700 dark:shadow-blue-900 shadow-blue-200">
            Salvează Jocul
          </button>

          <button onclick="location.reload()"
            class="px-8 py-4 text-lg font-bold text-white transition bg-red-500 dark:bg-red-800 shadow-lg dark:hover:bg-red-900 hover:bg-red-600 rounded-xl dark:shadow-red-900 shadow-red-200 ">
            Resetează Tot
          </button>

        </div>
        <a href="/pages/game-page/shuffle-game-page/shuffle-game.html" id="btn_mergilajoc"
          class="hidden px-8 py-4 mt-1 text-lg font-bold text-white transition bg-green-500 dark:bg-green-800 shadow-lg btnMergiLaJoc rounded-xl dark:hover:bg-green-900 hover:bg-green-600 dark:shadow-green-900 shadow-green-200">
          Mergi la joc</a>

        <p id="mesajEroareShuffle" class="hidden mt-6 font-semibold text-center "></p>
      </div>
    </div>

  </div>


  <!-- ----------------------------------------------- -->
  <!-- ----------------------------------------------- -->
  <!-- ----------------------------------------------- -->








  <!-- ------------------------------ ------------------------------------ -->
  <!-- ------------------------------Scripturi-------------------------------- -->
  <!-- ------------------------------------------------------------------------------->



  <!-- ----------------Crearea jocului----------------- -->
  <script type="module" src="/assets/js/modules/teachers/teachers.shuffle.js"></script>


  <!-- ---------------loading screen-------------- -->
  <script src="/assets/js/loading-srean.js"></script>


  <!-- ---------------autentificat ca profesor-------------- -->
  <script type="module" src="/assets/js/dashboard/autentficat-profesor.js"></script>


  <!-- ---------------header / footer-------------- -->
  <script src="/assets/js/materialHTML/materialHTML.js"></script>


  <!-- ----------------Scriptul care salveaza istoricul de creare a jocului------------------ -->
  <script type="module" src="/assets/js/game-service/teachers-create-game-shufle.js"></script>


  <!-- ---------------dashboard-------------- -->
  <script type="module" src="/assets/js/dashboard/student-dashboard.js"></script>
</body>

</html>
