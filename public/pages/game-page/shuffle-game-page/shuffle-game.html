    <style>
        .card {
            width: 100px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            cursor: pointer;
        }

        .front,
        .back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
        }

        .front {
            background-color: #ccc;
        }

        .back {
            transform: rotateY(180deg);
            background-size: cover;
            background-position: center;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        /* Când cardul este potrivit, fundalul devine verde și conținutul dispare */
        .card.matched .back {
            background-color: #4ade80 !important;
            /* Verde */
            background-image: none !important;
            /* Șterge imaginea */
            color: transparent;
            /* Ascunde textul */
            border-radius: 8px;
            box-shadow: 0 0 10px #4ade80;
        }

        /* Păstrăm rotația cardului ca să rămână verde pe față */
        .card.matched {
            transform: rotateY(180deg);
            cursor: default;
        }
    </style>



</head>
