    <style>
        .card {
            width: 100px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            cursor: pointer;
        }

        .front,
        .back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;

        }

        .front {
            background-color: #7AB5D3;
            border-radius: 20px;

        }

        .back {
            transform: rotateY(180deg);
            background-size: cover;
            background-position: center;
            background-color: #ffffff;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card.flipped {
            transform: rotateY(180deg);
            background: white;
            border-radius: 20px;

        }

        .card.matched .back {

            color: transparent;
            border-radius: 20px;
            transform: rotateY(180deg);
            transition: background 0.5s ease, box-shadow 0.5s ease;
            border-radius: 20px;
            background-color: #89d957 !important;
            background-image: linear-gradient(#89d957, #c9e265) !important;
            box-shadow: 0 0 15px #4ade80;
        }

        .card.matched {
            transform: rotateY(180deg);
            cursor: default;
        }

        .card.matched .back {
            animation: matchGlow 0.8s ease;
        }

        .card.matched {
            animation: matchScale 0.5s ease;
        }

        @keyframes matchGlow {
            0% {
                box-shadow: 0 0 0px #4ade80;
                transform: rotateY(180deg) scale(1);
            }

            50% {
                box-shadow: 0 0 25px #4ade80, 0 0 40px #22c55e;
                transform: rotateY(180deg) scale(1.05);
            }

            100% {
                box-shadow: 0 0 15px #4ade80;
                transform: rotateY(180deg) scale(1);
            }
        }

        @keyframes matchScale {
            0% {
                transform: rotateY(180deg) scale(1);
            }

            50% {
                transform: rotateY(180deg) scale(1.08);
            }

            100% {
                transform: rotateY(180deg) scale(1);
            }
        }


        @media (max-width: 768px) {
            .joc {
                grid-template-columns: repeat(4, 80px) !important;
                gap: 10px !important;
            }

            .card {
                width: 80px;
                height: 80px;
            }

            section {
                height: auto;
                padding: 20px 0;
            }
        }

        @media (max-width: 480px) {
            .joc {
                grid-template-columns: repeat(4, 70px) !important;
                gap: 8px !important;
            }

            .card {
                width: 70px;
                height: 70px;
            }

            .flex.justify-center.items-center.gap-6 {
                gap: 8px !important;
                flex-wrap: wrap;
                padding: 0 10px;
            }

            .nivelul,
            .time,
            .scor {
                font-size: 0.875rem;
                 
                padding: 8px 12px !important;
            }
        }

        @media (max-width: 350px) {
            .joc {
                grid-template-columns: repeat(4, 60px) !important;
            }

            .card {
                width: 60px;
                height: 60px;
            }
        }
    </style>
