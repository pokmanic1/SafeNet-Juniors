<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potrivește Perechile</title>
    <link rel="stylesheet" href="/assets/css/app.css">
    <link rel="icon" href="/assets/img/Vector.svg" type="image/svg+xml">

<body class="background-joc1 min-w-[375px] h-[100dvh] bg-cover bg-center bg-no-repeat"

    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->

    <!-- ----------------------------------------------- -->
    <!-- ----------------Header----------------------- -->
    <!-- ----------------------------------------------- -->

    <div class="sticky top-0 left-0 z-10 header"></div>


    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->


    <section class="flex flex-col justify-center items-center min-h-[90dvh] ">
        <div class="flex items-center justify-center gap-6">
            <div class="relative w-[130px]">

                <select
                    class="nivelul w-full px-5 py-3 font-medium text-center text-black bg-blue-200 dark:bg-[#332087] dark:text-white  rounded-xl ">
                    <option value="1" class="text-gray-700 dark:text-white">Nivelul 1</option>
                    <option value="2" class="text-black dark:text-white">Nivelul 2</option>
                    <option value="3" class="text-black dark:text-white">Nivelul 3</option>
                    <option value="4" class="text-black dark:text-white">Nivelul 4</option>
                </select>

            </div>
            <div

                time
            </div>
            <div
                class="flex items-center justify-center px-3 py-2 text-sm font-medium bg-blue-200 dark:bg-[#332087] dark:text-white  rounded-full shadow-md scor sm:px-4 lg:px-5 sm:py-3 sm:text-base">
                Scorul
                :0
            </div>
            <button
                class="restart w-[50px] p-3 rounded-[40px] flex items-center justify-center bg-blue-200 dark:bg-[#332087] dark:text-white   shadow-md text-xl"><img
                    src="/assets/img/img-shufle-game/buton_restart.svg" class="rst" alt="">
                </button>
        </div>

        <div class=" flex justify-center items-center m-0 font-serif mt-[40px]">
            <div class="container flex flex-col items-center justify-center ">
                <div class="joc grid grid-cols-[repeat(4,100px)] gap-4">


                </div>
            </div>
        </div>

    </section>

    <!-- ------------------------------------------------------------------------------->

    <!-- ---------------loading screen-------------- -->
    <script src="/assets/js/loading-srean.js"></script>





    <!-- ---------------header / footer-------------- -->
    <script src="/assets/js/materialHTML/materialHTML.js"></script>

    <!-- ---------------dashboard-------------- -->
    <script type="module" src="/assets/js/dashboard/student-dashboard.js"></script>

        import { buildModals } from "/assets/js/materialHTML/inserturi-games.js";
        buildModals("/documentatie-shuffle-game.html", "Perechi corecte");
