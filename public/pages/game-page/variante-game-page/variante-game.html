<head>

<body class="h-[100dvh] w-full bg-cover bg-center bg-no-repeat"
    style="background-image: url('../../../assets/img/backgrounds/Abackground.png');">



    <div class="container">

    </div>

    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->




    <div class="sticky top-0 left-0 z-10 header"></div>



    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->





    <section class="w-full flex justify-center items-center min-h-[90dvh] px-4">
        <div class="flex flex-col w-full lg:w-auto">
            <div class="flex flex-wrap justify-center lg:justify-start items-center gap-3 lg:gap-6 lg:ml-[170px]">

                <select
                    class="nivelul w-[130px] lg:w-[160px] text-center bg-blue-300 text-black font-medium px-5 py-3 rounded-full shadow-md cursor-pointer">
                    <option value="1" class="text-gray-700">Nivelul 1</option>
                    <option value="2" class="text-black">Nivelul 2</option>
                    <option value="3" class="text-black">Nivelul 3</option>
                    <option value="4" class="text-black">Nivelul 4</option>
                </select>

                <div
                    class="time w-[130px] lg:w-[160px] flex justify-center items-center bg-blue-300  px-5 py-3 rounded-full shadow-md font-medium">
                    time
                </div>

                <div
                    class="textScoar w-[130px] lg:w-[160px] flex justify-center items-center bg-blue-300 px-5 py-3 rounded-full shadow-md font-medium">
                    Scor: 0
                </div>

                <button
                    class="butonRestart w-[50px] h-[50px] flex items-center justify-center bg-blue-300 rounded-full shadow-md text-xl">
                    <img class="w-[60%]" src="../../../assets/img/img-shufle-game/A-buton-restart.png" alt="">
                </button>

            </div>

            <div
                class="mt-10 lg:mx-0 lg:ml-[170px] px-[12px] py-[8px] w-[150px] bg-blue-300 rounded-[20px] self-center -translate-x-1/2">
                <h1 class="text-center textIntrebare">Intrebarea:1</h1>
            </div>

            <div
                class="mx-auto py-7 sm:py-9 lg:py-10 px-5 sm:px-7 lg:px-8 w-[90vw] sm:w-[650px] bg-blue-300 rounded-[40px] mt-4">
                <h1 class="text-lg font-medium intrebarea1 sm:text-xl lg:text-2xl">Intrebarile</h1>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-[repeat(2,450px)] gap-3 lg:gap-7 mt-10">

                <div class="p-[6px] rounded-[18px] hover:scale-105 transition duration-200">
                    <button
                        class="butonVariante block w-full h-[100px] rounded-[20px] varianta1 bg-[#0242C9] hover:bg-[#0235A2] text-white font-semibold text-lg transition">
                        Varianta 1
                    </button>
                </div>

                <div class="p-[6px] rounded-[18px] hover:scale-105 transition duration-200">
                    <button
                        class="butonVariante block w-full h-[100px] rounded-[20px] varianta2 bg-[#0242C9] hover:bg-[#0235A2] text-white font-semibold text-lg transition">
                        Varianta 2
                    </button>
                </div>

                <div class="p-[6px] rounded-[18px] hover:scale-105 transition duration-200">
                    <button
                        class="butonVariante block w-full h-[100px] rounded-[20px] varianta3 bg-[#0242C9] hover:bg-[#0235A2] text-white font-semibold text-lg transition">
                        Varianta 3
                    </button>
                </div>

                <div class="p-[6px] rounded-[18px] hover:scale-105 transition duration-200">
                    <button
                        class="butonVariante block w-full h-[100px] rounded-[20px] varianta4 bg-[#0242C9] hover:bg-[#0235A2] text-white font-semibold text-lg transition">
                        Varianta 4
                    </button>
                </div>

            </div>

        </div>
    </section>
