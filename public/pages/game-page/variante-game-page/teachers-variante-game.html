<head>
    <meta charset="UTF-8">

<body class="background3 w-full min-w-[375px] transition-colors duration-300 bg-white body  dark:bg-[#31344D] dark:text-white ">

    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->


    <div class="sticky top-0 left-0 z-10 header"></div>



    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->



    <div class="w-full min-h-[90dvh] flex flex-col justify-center items-center px-4 py-12">

        <div class="w-full max-w-2xl p-8 text-center bg-white dark:bg-[#3d4060]/90 border shadow-xl md:p-12 rounded-3xl border-slate-300 dark:border-[#EBF6FF]/10">
            <span
                class="bg-blue-50 text-blue-600 text-xs font-bold uppercase tracking-widest px-4 py-1.5 rounded-full">Panou
                Profesor</span>
            <h1 class="mt-4 mb-8 text-3xl font-bold md:text-4xl text-slate-900 dark:text-[#EBF6FF]">
                Configurare Joc Variante
            </h1>

            <div id="pasul1" class="flex flex-col items-center space-y-6">
                <p class="mt-0 italic text-slate-500 dark:text-[#EBF6FF]/80">Stabilește numele si numărul de întrebări pentru elevi</p>


                <div class="w-full max-w-sm">
                    <input id="nume_joc" type="text" placeholder="Numele jocului"
                        class="w-full px-6 py-4 text-lg font-medium text-center transition-all border-2 shadow-xl outline-none border-slate-100 dark:border-[#EBF6FF]/10 rounded-2xl focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 bg-slate-50 dark:bg-[#2a2c3e] dark:text-[#EBF6FF]">
                </div>

                <input id="nr_intrebari" type="number" min="1" max="20" placeholder="Maxim 20" class="w-[70%] max-w-sm border-2 border-slate-100 dark:border-[#EBF6FF]/10 rounded-2xl px-6 py-4 
                focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10  shadow-xl
                outline-none transition-all text-center text-lg font-medium bg-slate-50 dark:bg-[#2a2c3e] dark:text-[#EBF6FF]">

                <button id="btn_incepe"
                    class="relative px-10 py-4 text-lg font-bold text-white transition-all group bg-slate-900 rounded-2xl hover:bg-blue-600 hover:shadow-2xl hover:shadow-blue-200 dark:hover:shadow-blue-800 active:scale-95">
                    Începe configurarea
                </button>
            </div>

            <div id="pasul2" class="flex flex-col hidden mt-8">
                <h2 id="titlu_pas"
                    class="text-xl font-semibold text-blue-800 bg-blue-50 dark:bg-[#2a2c3e] dark:text-blue-300 px-6 py-2 rounded-full w-[60%] mx-auto">
                    Întrebarea 1
                </h2>
                <p id="progres" class="mt-4 italic font-medium text-center text-slate-500 dark:text-[#EBF6FF]/80">
                    Întrebări salvate: 0 / 0
                </p>
                <div class="space-y-5 text-left">
                    <div>
                        <label class="ml-2 text-sm font-bold uppercase text-slate-400 dark:text-[#EBF6FF]/60">
                            Afirmatia
                        </label>
                        <input type="text" id="text_intrebare" placeholder="Scrie întrebarea aici..."
                            class="w-full px-6 py-4 mt-2 transition-all border-2 outline-none border-slate-100 dark:border-[#EBF6FF]/10 rounded-2xl focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 bg-slate-50 dark:bg-[#2a2c3e] dark:text-[#EBF6FF]">
                    </div>

                    <div class="grid grid-cols-1 gap-4">
                        <label class="ml-2 text-sm font-bold uppercase text-slate-400 dark:text-[#EBF6FF]/60">
                            Variante de răspuns
                        </label>

                        <div class="flex items-center gap-3 p-4 border-2 bg-slate-50 dark:bg-[#2a2c3e] rounded-2xl border-slate-100 dark:border-[#EBF6FF]/10">
                            <input type="radio" name="raspuns_corect" value="0" class="w-5 h-5 cursor-pointer">
                            <input type="text" id="v0" placeholder="Varianta 1"
                                class="flex-1 font-medium bg-transparent outline-none dark:text-[#EBF6FF] dark:placeholder-[#EBF6FF]/40">
                        </div>

                        <div class="flex items-center gap-3 p-4 border-2 bg-slate-50 dark:bg-[#2a2c3e] rounded-2xl border-slate-100 dark:border-[#EBF6FF]/10">
                            <input type="radio" name="raspuns_corect" value="1" class="w-5 h-5 cursor-pointer">
                            <input type="text" id="v1" placeholder="Varianta 2"
                                class="flex-1 font-medium bg-transparent outline-none dark:text-[#EBF6FF] dark:placeholder-[#EBF6FF]/40">
                        </div>

                        <div class="flex items-center gap-3 p-4 border-2 bg-slate-50 dark:bg-[#2a2c3e] rounded-2xl border-slate-100 dark:border-[#EBF6FF]/10">
                            <input type="radio" name="raspuns_corect" value="2" class="w-5 h-5 cursor-pointer">
                            <input type="text" id="v2" placeholder="Varianta 3"
                                class="flex-1 font-medium bg-transparent outline-none dark:text-[#EBF6FF] dark:placeholder-[#EBF6FF]/40">
                        </div>

                        <div class="flex items-center gap-3 p-4 border-2 bg-slate-50 dark:bg-[#2a2c3e] rounded-2xl border-slate-100 dark:border-[#EBF6FF]/10">
                            <input type="radio" name="raspuns_corect" value="3" class="w-5 h-5 cursor-pointer">
                            <input type="text" id="v3" placeholder="Varianta 4"
                                class="flex-1 font-medium bg-transparent outline-none dark:text-[#EBF6FF] dark:placeholder-[#EBF6FF]/40">
                        </div>
                    </div>
                </div>
                <div class="flex flex-col items-center justify-center">
                    <div class="flex flex-col justify-center gap-6 mt-12 md:flex-row">
                        <button id="btn_adauga"
                            class="flex px-8 py-4 font-bold text-white transition-all shadow-lg rounded-2xl bg-blue-600 dark:bg-blue-800  hover:bg-blue-700  dark:hover:bg-blue-900 dark:shadow-blue-800 shadow-blue-200">
                            Salvează Întrebarea
                        </button>

                        <button id="btn_restart"
                            class="px-8 py-4 text-lg font-bold text-white transition  shadow-lg rounded-xl bg-red-500  dark:bg-red-800  dark:hover:bg-red-900  hover:bg-red-600  dark:shadow-red-800 shadow-red-200">
                            Restartează Tot
                        </button>

                    </div>
                    <a href="./variante-game.html" id="btn_mergilajoc"
                        class="hidden px-8 py-4 mt-4 text-lg font-bold text-white transition shadow-lg btnMergiLaJoc rounded-xl bg-green-500 dark:bg-green-800  dark:hover:bg-green-900  hover:bg-green-600 dark:shadow-green-800  shadow-green-200"">
                        Mergi la joc</a>

                    <p id="mesajEroare" class="hidden mt-6 font-semibold text-center"></p>
                </div>

            </div>
        </div>
    </div>



    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->
          <!-- ---------------loading screen-------------- -->
  <script src="/public/assets/js/loading-srean.js"></script>



    <script type="module">
        import { salveazaJocVariante } from "../../../assets/js/game-service/teachers-create-game-variante.js";
        let arrIntrebariVariante = [];
        let numarTotal = 0;
        let toateIntrebarile = JSON.parse(localStorage.getItem("toate_jocVariante")) || [];
        const nume_joc = document.getElementById("nume_joc");
        const inputNr = document.getElementById("nr_intrebari");
        const btnIncepe = document.getElementById("btn_incepe");
        const pasul1 = document.getElementById("pasul1");
        const pasul2 = document.getElementById("pasul2");

        const inputText = document.getElementById("text_intrebare");
        const btnAdauga = document.getElementById("btn_adauga");
        const btnRestart = document.getElementById("btn_restart");
        const titluPas = document.getElementById("titlu_pas");
        const progresText = document.getElementById("progres");

        btnIncepe.addEventListener("click", () => {
            numarTotal = parseInt(inputNr.value);
            if (numarTotal > 0) {
                pasul1.classList.add("hidden");
                pasul2.classList.remove("hidden");
                actualizeazaInterfata();
            } else {
                afiseazaEroare("Introdu un număr valid de întrebări!", "text-red-500");
            }
        });

        btnAdauga.addEventListener("click", async () => {
            const textIntrebare = inputText.value.trim();
            const radioCorect = document.querySelector('input[name="raspuns_corect"]:checked');

            const v0 = document.getElementById("v0").value.trim();
            const v1 = document.getElementById("v1").value.trim();
            const v2 = document.getElementById("v2").value.trim();
            const v3 = document.getElementById("v3").value.trim();
            let mesajEroare = document.getElementById("mesajEroare");

            function afiseazaEroare(text, culoare, timp = 2000) {
                mesajEroare.innerText = text;
                mesajEroare.classList.remove("hidden");
                mesajEroare.classList.add(culoare);

                setTimeout(() => {
                    mesajEroare.classList.add("hidden");
                    mesajEroare.innerText = "";
                }, timp);
            }

            if (!textIntrebare || !v0 || !v1 || !v2 || !v3) {
                afiseazaEroare("Te rugăm să completezi toate câmpurile!", "text-red-500");
                return;
            }

            if (!radioCorect) {
                afiseazaEroare("Te rugăm să bifezi varianta corectă!", "text-red-500");
                return;
            }

            const indexCorect = parseInt(radioCorect.value);

            const obiectIntrebare = {
                intrebare: textIntrebare,
                variante: [
                    { varianta: v0, raspuns: indexCorect === 0 },
                    { varianta: v1, raspuns: indexCorect === 1 },
                    { varianta: v2, raspuns: indexCorect === 2 },
                    { varianta: v3, raspuns: indexCorect === 3 }
                ]
            };

            arrIntrebariVariante.push(obiectIntrebare);

            localStorage.setItem("jocVarianteCustom", JSON.stringify(arrIntrebariVariante));

            let joc = {
                nume: nume_joc.value,
                tip: 'variante',
                intrebari: [...arrIntrebariVariante]
            }
            await salveazaJocVariante(joc);
            console.log("Joc salvat:", joc);


            inputText.value = "";
            document.getElementById("v0").value = "";
            document.getElementById("v1").value = "";
            document.getElementById("v2").value = "";
            document.getElementById("v3").value = "";
            radioCorect.checked = false;

            if (arrIntrebariVariante.length < numarTotal) {
                actualizeazaInterfata();
            } else {
                afiseazaEroare("Toate întrebările au fost salvate cu succes!", "text-green-500");
                document.querySelector(".btnMergiLaJoc").classList.remove("hidden");

                btnAdauga.disabled = true;
                btnAdauga.classList.add("opacity-50", "cursor-not-allowed");
            }
        });

        btnRestart.addEventListener("click", () => {
            if (confirm("Ești sigur că vrei să ștergi tot?")) {
                localStorage.removeItem("jocVarianteCustom");
                location.reload();
            }
        });

        function actualizeazaInterfata() {
            titluPas.textContent = `Configurează Întrebarea ${arrIntrebariVariante.length + 1}`;
            progresText.textContent = `Întrebări salvate: ${arrIntrebariVariante.length} / ${numarTotal}`;
        }
    </script>
