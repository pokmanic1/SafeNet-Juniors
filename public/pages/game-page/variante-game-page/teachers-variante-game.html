<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesori - Răspunde Corect</title>
    <link rel="stylesheet" href="../../../assets/css/app.css">
    <link rel="icon" href="../../../assets/img/Vector.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .container {
            display: flex;
            gap: 5px;
            width: 70%;
        }

        .card {
            transition: 0.4s ease-in-out;
            flex: 1;
        }

        .card:hover {
            flex: 2;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header class="sticky top-0 left-0 z-10 bg-white border-[1px] border-b border-gray-300">
        <div class="mx-[10px] md:mx-[30px] lg:mx-[40px] max-w-full px-6 py-3 flex items-center justify-between">

            <a href="../../../index.html" class="flex items-center gap-3">
                <img class="w-20 object-contain" src="../../../assets/img/Logo.svg" alt="SafeNet Junior">
            </a>

            <nav class="hidden md:flex items-center gap-12 font-semibold absolute left-1/2 transform -translate-x-1/2">
                <a class="hover:text-gray-700" href="../../games.html">Jocuri</a>
                <a class="hover:text-gray-700" href="../../assessment.html">Teste</a>
            </nav>

            <div class="hidden md:flex items-center gap-10 font-semibold">
                <a id="InregistreazataID" class="hover:text-gray-700" href="../../inregistreazate.html">Înregistrare</a>
                <a id="ConecteazataID" class="hover:text-gray-700" href="../../conecteazate.html">Conectare</a>
            </div>

            <button id="menuBtn"
                class="md:hidden inline-flex items-center justify-center rounded-xl p-2 text-gray-900 hover:bg-gray-100 transition"
                aria-label="Deschide meniul" aria-controls="mobileMenu" aria-expanded="false">
                <svg id="iconOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>

                <svg id="iconClose" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div id="mobileMenu" class="md:hidden hidden border-t border-gray-200 bg-white">
            <div class="mx-auto max-w-7xl px-6 py-4 space-y-3 font-semibold">

                <a class="block py-2 hover:text-gray-700" href="../../games.html">Jocuri</a>
                <a class="block py-2 hover:text-gray-700" href="../../assessment.html">Teste</a>

                <div class="h-px bg-gray-200 my-2"></div>

                <a id="InregistreazataID_M" class="block py-2 hover:text-gray-700" href="../../inregistreazate.html">
                    Înregistrare
                </a>
                <a id="ConecteazataID_M" class="block py-2 hover:text-gray-700" href="../../conecteazate.html">
                    Conectare
                </a>
            </div>
        </div>
    </header>





    <div class="w-full min-h-[90dvh] flex flex-col justify-center items-center p-6">

        <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-200 w-full max-w-2xl">
            <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">Configurare Joc Variante</h1>

            <div id="pasul1" class="flex flex-col items-center">
                <label class="mb-2 font-medium text-gray-700">Câte întrebări dorești să creezi?</label>
                <div class="w-full max-w-sm  ">
                    <input id="nume_joc" type="text" placeholder="Numele jocului"
                        class="w-full border-2 border-slate-800 rounded-2xl px-6 py-4 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition-all text-center text-lg font-medium bg-slate-50">
                </div>

                <input id="nr_intrebari" type="number" min="1" max="20" placeholder="Maxim 20"
                    class="border-2 border-blue-100 w-full p-3 mb-6 mt-[20px] rounded-xl focus:border-blue-500 outline-none transition">
                <button id="btn_incepe"
                    class="group relative bg-slate-900 text-white px-10 py-4 rounded-2xl font-bold text-lg hover:bg-blue-600 transition-all hover:shadow-2xl hover:shadow-blue-200 active:scale-95">
                    Începe configurarea
                </button>
            </div>

            <div id="pasul2" class="flex flex-col hidden">
                <h2 id="titlu_pas" class="text-xl mb-6 font-bold text-blue-700 border-b pb-2">Întrebarea 1</h2>

                <div class="space-y-4">
                    <div>
                        <label class="text-sm font-semibold text-gray-600">Textul întrebării:</label>
                        <input type="text" id="text_intrebare" placeholder="Scrie întrebarea aici..."
                            class="border border-gray-300 w-full p-3 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
                    </div>

                    <div class="grid grid-cols-1 gap-3">
                        <label class="text-sm font-semibold text-gray-600">Variante de răspuns (bifează pe cea
                            corectă):</label>

                        <div class="flex items-center gap-3 bg-gray-50 p-3 rounded-lg border">
                            <input type="radio" name="raspuns_corect" value="0" class="w-5 h-5 cursor-pointer">
                            <input type="text" id="v0" placeholder="Varianta 1"
                                class="flex-1 bg-transparent outline-none">
                        </div>

                        <div class="flex items-center gap-3 bg-gray-50 p-3 rounded-lg border">
                            <input type="radio" name="raspuns_corect" value="1" class="w-5 h-5 cursor-pointer">
                            <input type="text" id="v1" placeholder="Varianta 2"
                                class="flex-1 bg-transparent outline-none">
                        </div>

                        <div class="flex items-center gap-3 bg-gray-50 p-3 rounded-lg border">
                            <input type="radio" name="raspuns_corect" value="2" class="w-5 h-5 cursor-pointer">
                            <input type="text" id="v2" placeholder="Varianta 3"
                                class="flex-1 bg-transparent outline-none">
                        </div>

                        <div class="flex items-center gap-3 bg-gray-50 p-3 rounded-lg border">
                            <input type="radio" name="raspuns_corect" value="3" class="w-5 h-5 cursor-pointer">
                            <input type="text" id="v3" placeholder="Varianta 4"
                                class="flex-1 bg-transparent outline-none">
                        </div>
                    </div>
                </div>

                <div class="flex gap-4 mt-8">
                    <button id="btn_adauga"
                        class="flex-1 bg-green-600 text-white font-bold py-3 rounded-xl hover:bg-green-700 transition shadow-md">
                        Salvează Întrebarea
                    </button>
                    <button id="btn_restart"
                        class="bg-red-100 text-red-600 font-bold px-6 py-3 rounded-xl hover:bg-red-200 transition">
                        Reset
                    </button>
                </div>
                <p id="mesajEroare" class=" text-center  mt-6 text-[14px] hidden">aaaaaaaaaaaa </p>
                <p id="progres" class="mt-2 text-center text-gray-500 font-medium italic">Întrebări salvate: 0 / 0</p>

            </div>
        </div>
    </div>





    <script type="module">
        import { salveazaJocVariante } from "../../../assets/js/game-service/teachers-create-game-variante.js";
        let arrIntrebariVariante = [];
        let numarTotal = 0;
        let toateIntrebarile = JSON.parse(localStorage.getItem("toate_jocVariante")) || [];
        const nume_joc = document.getElementById("nume_joc");
        const inputNr = document.getElementById("nr_intrebari");
        const btnIncepe = document.getElementById("btn_incepe");
        const pasul1 = document.getElementById("pasul1");
        const pasul2 = document.getElementById("pasul2");

        const inputText = document.getElementById("text_intrebare");
        const btnAdauga = document.getElementById("btn_adauga");
        const btnRestart = document.getElementById("btn_restart");
        const titluPas = document.getElementById("titlu_pas");
        const progresText = document.getElementById("progres");

        btnIncepe.addEventListener("click", () => {
            numarTotal = parseInt(inputNr.value);
            if (numarTotal > 0) {
                pasul1.classList.add("hidden");
                pasul2.classList.remove("hidden");
                actualizeazaInterfata();
            } else {
                afiseazaEroare("Introdu un număr valid de întrebări!", "text-red-500");
            }
        });

        btnAdauga.addEventListener("click", async() => {
            const textIntrebare = inputText.value.trim();
            const radioCorect = document.querySelector('input[name="raspuns_corect"]:checked');

            const v0 = document.getElementById("v0").value.trim();
            const v1 = document.getElementById("v1").value.trim();
            const v2 = document.getElementById("v2").value.trim();
            const v3 = document.getElementById("v3").value.trim();
            let mesajEroare = document.getElementById("mesajEroare");

            function afiseazaEroare(text, culoare, timp = 2000) {
                mesajEroare.innerText = text;
                mesajEroare.classList.remove("hidden");
                mesajEroare.classList.add(culoare);

                setTimeout(() => {
                    mesajEroare.classList.add("hidden");
                    mesajEroare.innerText = "";
                }, timp);
            }

            if (!textIntrebare || !v0 || !v1 || !v2 || !v3) {
                afiseazaEroare("Te rugăm să completezi toate câmpurile!", "text-red-500");
                return;
            }

            if (!radioCorect) {
                afiseazaEroare("Te rugăm să bifezi varianta corectă!", "text-red-500");
                return;
            }

            const indexCorect = parseInt(radioCorect.value);

            const obiectIntrebare = {
                intrebare: textIntrebare,
                variante: [
                    { varianta: v0, raspuns: indexCorect === 0 },
                    { varianta: v1, raspuns: indexCorect === 1 },
                    { varianta: v2, raspuns: indexCorect === 2 },
                    { varianta: v3, raspuns: indexCorect === 3 }
                ]
            };

            arrIntrebariVariante.push(obiectIntrebare);

            localStorage.setItem("jocVarianteCustom", JSON.stringify(arrIntrebariVariante));

            let joc = {
                nume: nume_joc.value,
                tip: 'variante',
                intrebari: [...arrIntrebariVariante]
            }
            await salveazaJocVariante(joc);
            console.log("Joc salvat:", joc);


            inputText.value = "";
            document.getElementById("v0").value = "";
            document.getElementById("v1").value = "";
            document.getElementById("v2").value = "";
            document.getElementById("v3").value = "";
            radioCorect.checked = false;

            if (arrIntrebariVariante.length < numarTotal) {
                actualizeazaInterfata();
            } else {
                afiseazaEroare("Toate întrebările au fost salvate cu succes!", "text-green-500");
                btnAdauga.disabled = true;
                btnAdauga.classList.add("opacity-50", "cursor-not-allowed");
            }
        });

        btnRestart.addEventListener("click", () => {
            if (confirm("Ești sigur că vrei să ștergi tot?")) {
                localStorage.removeItem("jocVarianteCustom");
                location.reload();
            }
        });

        function actualizeazaInterfata() {
            titluPas.textContent = `Configurează Întrebarea ${arrIntrebariVariante.length + 1}`;
            progresText.textContent = `Întrebări salvate: ${arrIntrebariVariante.length} / ${numarTotal}`;
        }
    </script>




    <script>
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        const iconOpen = document.getElementById('iconOpen');
        const iconClose = document.getElementById('iconClose');

        function setMenu(open) {
            mobileMenu.classList.toggle('hidden', !open);
            iconOpen.classList.toggle('hidden', open);
            iconClose.classList.toggle('hidden', !open);
            menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
        }

        menuBtn.addEventListener('click', () => {
            const isOpen = !mobileMenu.classList.contains('hidden');
            setMenu(!isOpen);
        });

        // Închide meniul când se schimbă la desktop
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) setMenu(false);
        });

        // Închide meniul când se apasă Escape
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') setMenu(false);
        });
    </script>

    <script type="module" src="../../../assets/js/game-service/teachers-create-game-variante.js"></script>
    <script type="module" src="../../../assets/js/dashboard/student-dashboard.js"></script>
</body>

</html>
