<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Document</title>
</head>

<body class="h-[120dvh] w-full bg-cover bg-center bg-repeat"
    style="background-image: url('../../../assets/img/backgrounds/Abackground.png');">

    <div id="finalModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">

        <div class="bg-[#7AB5D3] rounded-[20px] p-7 w-[380px] relative text-center">



            <div class="flex justify-center items-end gap-1.5 mb-3">
                <div class="w-7 h-7 bg-[#f5c518]"
                    style="clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)">
                </div>
                <div class="w-[38px] h-[38px] bg-[#f5c518]"
                    style="clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)">
                </div>
                <div class="w-7 h-7 bg-[#f5c518]"
                    style="clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)">
                </div>
            </div>

            <h1 class="text-[22px] font-bold text-[#1a1a2e] mb-5">Felicitări!</h1>

            <div class="bg-[#ffffff] rounded-xl px-5 py-2 flex flex-col">

                <div class="flex justify-between py-3 border-b">
                    <span>Nivelul</span>
                    <span id="nivelFinal"></span>
                </div>

                <div class="flex justify-between py-3 border-b">
                    <span>Întrebări corecte</span>
                    <span id="scorFinal"></span>
                </div>

                <div class="flex justify-between py-3">
                    <span>Timpul</span>
                    <span id="timpFinal"></span>
                </div>

            </div>

            <div class="flex gap-3 mt-5">
                <button id="retryBtn" class="restart1 flex-1 py-[11px] border bg-white rounded-full text-[13px]">
                    Încearcă din nou
                </button>


                <a href="../../games.html" class="flex-1 py-[11px] bg-[#3a7bd5] rounded-full text-white">Meniu
                    Jocuri</a>
            </div>

        </div>
    </div>

    <header class="w-full bg-white ">
        <div class="mx-auto max-w-7xl px-6 py-3 flex items-center justify-between">

            <!-- Left: Logo -->
            <a href="../../../index.html" class="flex items-center gap-3">
                <img class="w-20 object-contain" src="../assets/img/image-removebg-preview (5).png"
                    alt="SafeNet Junior">
            </a>

            <!-- Desktop menu -->
            <nav class="hidden md:flex items-center gap-12 font-semibold">
                <a class="hover:text-gray-700" href="../../games.html">Jocuri</a>
                <a class="hover:text-gray-700" href="../../assessment.html">Teste</a>
            </nav>

            <!-- Desktop auth -->
            <div class="hidden md:flex items-center gap-10 font-semibold">
                <a id="InregistreazataID" class="hover:text-gray-700"
                    href="./pages/inregistreazate.html">Înregistrare</a>
                <a id="ConecteazataID" class="hover:text-gray-700" href="./pages/conecteazate.html">Conectare</a>
            </div>

            <!-- Mobile toggle -->
            <button id="menuBtn"
                class="md:hidden inline-flex items-center justify-center rounded-xl p-2 text-gray-900 hover:bg-gray-100 transition"
                aria-label="Deschide meniul" aria-controls="mobileMenu" aria-expanded="false">
                <!-- Icon hamburger -->
                <svg id="iconOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>

                <!-- Icon X -->
                <svg id="iconClose" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Mobile menu -->
        <div id="mobileMenu" class="md:hidden hidden border-t border-gray-200 bg-white">
            <div class="mx-auto max-w-7xl px-6 py-4 space-y-3 font-semibold">

                <a class="block py-2 hover:text-gray-700" href="./pages/games.html">Jocuri</a>
                <a class="block py-2 hover:text-gray-700" href="./pages/assessment.html">Assessment</a>

                <div class="h-px bg-gray-200 my-2"></div>

                <a id="InregistreazataID_M" class="block py-2 hover:text-gray-700" href="./pages/inregistreazate.html">
                    Înregistrare
                </a>
                <a id="ConecteazataID_M" class="block py-2 hover:text-gray-700" href="./pages/conecteazate.html">
                    Conectare
                </a>
            </div>
        </div>
    </header>



    <!-- ----------------------------------------------- -->



    <div class="cutia">
        <div class="flex flex-col items-center justify-start h-full">

            <div
                class="flex flex-col justify-center items-center mt-[60px] sm:mt-[80px] lg:mt-[100px] py-[20px] sm:py-[25px] lg:py-[30px] px-4 sm:px-10 lg:px-[80px] rounded-[20px] mb-[60px] sm:mb-[80px] lg:mb-[100px] w-full max-w-[95vw] sm:max-w-[90vw] lg:max-w-none">

                <div
                    class="flex flex-wrap justify-center items-center mx-auto lg:ml-[75px] mt-[20px] sm:mt-[25px] lg:mt-[30px] gap-3 sm:gap-4 lg:gap-6 w-full">

                    <select
                        class="nivelul w-[130px]  sm:w-[145px] lg:w-[160px] text-center bg-blue-200 text-black font-medium px-3 sm:px-4 lg:px-5 py-2 sm:py-3 rounded-full shadow-md cursor-pointer text-sm sm:text-base">
                        <option value="1" class="text-gray-700">Nivelul 1</option>
                        <option value="2" class="text-black">Nivelul 2</option>
                        <option value="3" class="text-black">Nivelul 3</option>
                        <option value="4" class="text-black">Nivelul 4</option>
                    </select>

                    <div
                        class="time w-[130px] sm:w-[145px] lg:w-[160px] flex justify-center items-center bg-blue-200 px-3 sm:px-4 lg:px-5 py-2 sm:py-3 rounded-full shadow-md font-medium text-sm sm:text-base">
                        time
                    </div>

                    <div
                        class="scorul w-[130px] sm:w-[145px] lg:w-[160px] flex justify-center items-center bg-blue-200 px-3 sm:px-4 lg:px-5 py-2 sm:py-3 rounded-full shadow-md font-medium text-sm sm:text-base">
                        Scor: 0
                    </div>

                    <button
                        class="restart w-[42px] h-[42px] sm:w-[46px] sm:h-[46px] lg:w-[50px] lg:h-[50px] flex items-center justify-center bg-blue-200 rounded-full shadow-md text-xl">
                        <img class="w-[60%]" src="../../../assets/img/img-shufle-game/A-buton-restart.png" alt="">
                    </button>

                    <div class="relative w-[110px] hidden lg:block">
                    </div>
                </div>

                <h1
                    class="text-base sm:text-lg text-start font-bold mt-[30px] sm:mt-[35px] lg:mt-[40px] w-full max-w-[95vw] sm:max-w-[480px] lg:max-w-[550px]">
                    Creează o parola puternică</h1>

                <input type="text" placeholder="Parola"
                    class="input-parola w-full sm:w-[480px] lg:w-[550px] h-[70px] sm:h-[80px] lg:h-[90px] p-[20px] sm:p-[25px] lg:p-[30px] bg-blue-300 rounded-[20px] text-sm sm:text-base">

                <div id="conditiiContainer"
                    class="w-full sm:w-[480px] lg:w-[500px] mt-[30px] sm:mt-[35px] lg:mt-[40px] space-y-3">
                </div>

            </div>
        </div>
    </div>



    <script type="module" src="../../../assets/js/modules/password-game.js"></script>
    <script type="module" src="../../../assets/js/dashboard/student-dashboard.js"></script>

</body>

</html>
