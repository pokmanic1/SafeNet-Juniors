<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creează Parola</title>
    <link rel="stylesheet" href="../../../assets/css/app.css">
    <link rel="icon" href="../../../assets/img/Vector.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>

</head>

<body class="h-[120dvh] w-full bg-cover bg-center bg-repeat"
    style="background-image: url('../../../assets/img/backgrounds/Abackground.png');">

  <!-- ----------------------------------------------- -->
  <!-- ----------------------------------------------- -->
  <!-- ----------------------------------------------- -->


    <div id="dacaNuSaConectat" class="fixed inset-0 z-50 flex items-center justify-center hidden bg-black/50">

        <div class="bg-white border border-gray-200 rounded-3xl w-[420px] px-10 py-10 text-center shadow-2xl">

            <div class="flex items-center justify-center mx-auto mb-6 w-14 h-14 bg-blue-50 rounded-2xl">
                <img src="../../../assets/img/Vector.svg" alt="Shield" class="h-auto w-14">
            </div>

            <h2 class="text-[22px] font-semibold text-gray-900 mb-2 tracking-tight">Înainte să începi…</h2>
            <p class="text-[13px] text-gray-400 mb-8">Conectează-te pentru a iti salva progresul.</p>

            <a href="../../conecteazate.html"
                class=" h-[40px] bg-slate-900 text-white px-20 py-2 rounded-2xl font-medium text-md hover:bg-blue-600 transition-all hover:shadow-2xl hover:shadow-blue-200 active:scale-95">
                Conectează-te
            </a>

            <p class="mt-4 text-[12px] text-gray-400">
                Nu ai cont? <a href="../../inregistreazate.html"
                    class="text-[#185FA5] hover:underline">Înregistrează-te</a>
            </p>


        </div>
    </div>


  <!-- ----------------------------------------------- -->
  <!-- ----------------------------------------------- -->
  <!-- ----------------------------------------------- -->



    <div id="dacaNuACititDocum" class="fixed inset-0 z-50 flex items-center justify-center hidden bg-black/50">

        <div class=" relative bg-[#7AB5D3] rounded-2xl border border-blue-700 shadow-lg p-10 w-[450px] text-center">
            <button onclick="document.getElementById('dacaNuACititDocum').classList.add('hidden')"
                class="absolute top-3 right-4 bg-blue-700 hover:bg-blue-800 text-white w-[30px] h-[30px] rounded-full flex items-center justify-center text-2xl font-bold transition duration-100 hover:scale-105">
                ×
            </button>
            <div class="flex justify-center mb-5">
                <img src="../../../assets/img/Vector.svg" alt="Shield" class="h-auto w-14">
            </div>

            <h2 class="mb-2 text-xl font-semibold text-gray-900">Înainte să începi ...</h2>
            <p class="mb-6 text-sm text-gray-500">Citește cu atenție Documentația</p>

            <a href="./documentatie-password-game.html"
                class="inline-flex items-center justify-center gap-2 w-[200px] bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-6 py-2.5 rounded-xl transition">
                Documentație
            </a>
        </div>
    </div>



  <!-- ----------------------------------------------- -->
  <!-- ----------------------------------------------- -->
  <!-- ----------------------------------------------- -->



    <div id="finalModal" class="fixed inset-0 z-50 flex items-center justify-center hidden bg-black/50">

        <div class="bg-[#7AB5D3] rounded-[20px] p-7 w-[380px] relative text-center">



            <div class="flex justify-center items-end gap-1.5 mb-3">
                <div class="w-7 h-7 bg-[#f5c518]"
                    style="clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)">
                </div>
                <div class="w-[38px] h-[38px] bg-[#f5c518]"
                    style="clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)">
                </div>
                <div class="w-7 h-7 bg-[#f5c518]"
                    style="clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)">
                </div>
            </div>

            <h1 class="text-[22px] font-bold text-[#1a1a2e] mb-5">Felicitări!</h1>

            <div class="bg-[#ffffff] rounded-xl px-5 py-2 flex flex-col">

                <div class="flex justify-between py-3 border-b">
                    <span>Nivelul</span>
                    <span id="nivelFinal"></span>
                </div>

                <div class="flex justify-between py-3 border-b">
                    <span>Întrebări corecte</span>
                    <span id="scorFinal"></span>
                </div>

                <div class="flex justify-between py-3">
                    <span>Timpul</span>
                    <span id="timpFinal"></span>
                </div>

            </div>

            <div class="flex gap-3 mt-5">
                <button id="retryBtn" class="restart1 flex-1 py-[11px] border bg-white rounded-full text-[13px]">
                    Încearcă din nou
                </button>


                <a href="../../games.html" class="flex-1 py-[11px] bg-[#3a7bd5] rounded-full text-white">Meniu
                    Jocuri</a>
            </div>

        </div>
    </div>

  <!-- ----------------------------------------------- -->
  <!-- ----------------------------------------------- -->
  <!-- ----------------------------------------------- -->


  
  <div class="sticky top-0 left-0 z-10 header"></div>




  <!-- ----------------------------------------------- -->
  <!-- ----------------------------------------------- -->
  <!-- ----------------------------------------------- -->




    <div
        class="cutia min-h-[100dvh] flex flex-col justify-center items-center                                          ">
        <div class="flex flex-col items-center justify-center h-full">

            <div
                class="flex flex-col justify-center items-center py-[20px] sm:py-[25px] lg:py-[30px] px-4 sm:px-10 lg:px-[80px] rounded-[20px] mb-[60px] sm:mb-[80px] lg:mb-[100px] w-full max-w-[95vw] sm:max-w-[90vw] lg:max-w-none">

                <div
                    class="flex flex-wrap justify-center items-center mx-auto lg:ml-[75px] mt-[20px] sm:mt-[25px] lg:mt-[30px] gap-3 sm:gap-4 lg:gap-6 w-full">

                    <select
                        class="nivelul w-[130px]  sm:w-[145px] lg:w-[160px] text-center bg-blue-200 text-black font-medium px-3 sm:px-4 lg:px-5 py-2 sm:py-3 rounded-full shadow-md cursor-pointer text-sm sm:text-base">
                        <option value="1" class="text-gray-700">Nivelul 1</option>
                        <option value="2" class="text-black">Nivelul 2</option>
                        <option value="3" class="text-black">Nivelul 3</option>
                        <option value="4" class="text-black">Nivelul 4</option>
                    </select>

                    <div
                        class="time w-[130px] sm:w-[145px] lg:w-[160px] flex justify-center items-center bg-blue-200 px-3 sm:px-4 lg:px-5 py-2 sm:py-3 rounded-full shadow-md font-medium text-sm sm:text-base">
                        time
                    </div>

                    <div
                        class="scorul w-[130px] sm:w-[145px] lg:w-[160px] flex justify-center items-center bg-blue-200 px-3 sm:px-4 lg:px-5 py-2 sm:py-3 rounded-full shadow-md font-medium text-sm sm:text-base">
                        Scor: 0
                    </div>

                    <button
                        class="restart w-[42px] h-[42px] sm:w-[46px] sm:h-[46px] lg:w-[50px] lg:h-[50px] flex items-center justify-center bg-blue-200 rounded-full shadow-md text-xl">
                        <img class="w-[60%]" src="../../../assets/img/img-shufle-game/A-buton-restart.png" alt="">
                    </button>

                    <div class="relative w-[110px] hidden lg:block">
                    </div>
                </div>

                <h1
                    class="text-base sm:text-lg text-center font-bold mt-[30px] sm:mt-[35px] lg:mt-[40px] w-full max-w-[95vw] sm:max-w-[480px] lg:max-w-[550px]">
                    Creează o parola puternică</h1>

                <input type="text" placeholder="Parola"
                    class="input-parola bg-blue-300 w-full mt-2 sm:w-[480px] lg:w-[550px] p-[20px] sm:p-[25px] lg:p-[20px] rounded-[20px] text-base sm:text-xl focus:outline-none focus:ring-2 focus:ring-black/10">

                <div id="conditiiContainer"
                    class="w-full sm:w-[480px] lg:w-[500px] mt-[30px] sm:mt-[35px] lg:mt-[40px] space-y-3">


                </div>

            </div>
        </div>
    </div>
