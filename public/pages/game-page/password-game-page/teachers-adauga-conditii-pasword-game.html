<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesori - Creează Parola</title>
    <link rel="stylesheet" href="/assets/css/app.css">
    <link rel="icon" href="/assets/img/Vector.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">

</head>

<body
    class="background2 w-full min-w-[375px] transition-colors duration-300 bg-white body  dark:bg-[#31344D] dark:text-white ">

    <!-- ----------------------------------------------- -->
    <!-- ----------------Header----------------------- -->
    <!-- ----------------------------------------------- -->



    <div class="sticky top-0 left-0 z-10 header"></div>



    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->
    <!-- ----------------------------------------------- -->






    <div class="flex flex-col items-center justify-center min-h-screen px-4 py-10">
        <div
            class="w-full max-w-2xl p-5 text-center bg-white dark:bg-[#3d4060]/90 border shadow-xl rounded-3xl dark:shadow-slate-800/60 shadow-slate-200/60 border-slate-300 dark:border-[#EBF6FF]/10">

            <div class="mb-[18px] md:mb-[30px] mt-[20px] md:mt-[40px] ">
                <span
                    class="bg-blue-50 text-blue-600 text-xs font-bold uppercase tracking-widest px-4 py-1.5 rounded-full">Panou
                    Profesor</span>
                <h1 class="mt-4 text-3xl font-bold md:text-4xl text-slate-900 dark:text-[#EBF6FF]">Configurează
                    provocarea</h1>
                <p class="mt-0 italic text-slate-500 dark:text-[#EBF6FF]/80">Stabilește numele si numărul de întrebări
                    pentru elevi</p>
            </div>

            <div class="flex flex-col items-center justify-center space-y-6">
                <div class="w-full max-w-sm">
                    <input id="nume_joc" type="text" placeholder="Numele jocului"
                        class="w-full px-6 py-4 text-lg font-medium text-center transition-all border-2 shadow-xl outline-none border-slate-100 dark:border-[#EBF6FF]/10 rounded-2xl focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 bg-slate-50 dark:bg-[#2a2c3e] dark:text-[#EBF6FF]">
                </div>
                <div class="w-full max-w-sm">
                    <input id="nr_conditii" type="number" min="1" max="10" step="1"
                        placeholder="Câte condiții vrei? (1-10)"
                        class="w-[80%] border-2 border-slate-100 dark:border-[#EBF6FF]/10 rounded-2xl px-6 py-4 shadow-xl focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition-all text-center text-lg font-medium bg-slate-50 dark:bg-[#2a2c3e] dark:text-[#EBF6FF]">
                </div>

                <button id="btn_incepe"
                    class="relative px-10 py-4 text-lg font-bold text-white transition-all group bg-slate-900 rounded-2xl hover:bg-blue-600 hover:shadow-2xl hover:shadow-blue-200 dark:hover:shadow-blue-800 active:scale-95">
                    Începe configurarea
                </button>

                <div class="w-full space-y-4">
                    <h2 id="titlu_pas"
                        class="px-6 py-2 hidden text-xl font-semibold text-blue-800 dark:text-blue-300 rounded-full bg-blue-50 dark:bg-[#2a2c3e]">
                        Configurează
                        regula 1</h2>
                    <select id="conditie"
                        class="hidden w-full px-6 py-4 font-medium transition-all border-2 outline-none border-slate-100 dark:border-[#EBF6FF]/10 rounded-2xl focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 bg-slate-50 dark:bg-[#2a2c3e] dark:text-[#EBF6FF]">
                        <option value="" disabled selected>Alege o regulă pentru parolă...</option>
                        <option value="0">Să conțină un număr</option>
                        <option value="1">Să conțină un cuvânt specific</option>
                        <option value="1">Să aibă un număr minim de caractere</option>
                        <option value="0">Să conțină o literă mare</option>
                        <option value="0">Să conțină un caracter special</option>
                        <option value="1">Să aibă un număr minim de cifre</option>
                        <option value="0">Să nu conțină spații</option>
                        <option value="0">Să aibă lungime pară</option>
                        <option value="0">Să aibă lungime impară</option>
                        <option value="1">Să conțină un număr specific</option>
                        <option value="1">Să conțină o literă specifică</option>
                    </select>

                    <input type="text" id="valoareExtra" placeholder="Introdu valoarea aici..."
                        class="hidden w-full px-6 py-4 transition-all border-2 outline-none border-slate-100 dark:border-[#EBF6FF]/10 rounded-2xl focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 bg-slate-50 dark:bg-[#2a2c3e] dark:text-[#EBF6FF]" />
                </div>
                <div class="flex flex-col items-center justify-center">
                    <div class="flex flex-col justify-center w-full gap-4 sm:flex-row">
                        <button id="btn"
                            class="hidden px-8 py-4 font-bold text-white transition-all  shadow-lg rounded-2xl bg-blue-600 dark:bg-blue-800  hover:bg-blue-700  dark:hover:bg-blue-900 dark:shadow-blue-800 shadow-blue-200">
                            Adaugă Regula
                        </button>



                        <button id="btn_restart"
                            class="hidden px-8 py-4 text-lg font-bold text-white transition shadow-lg rounded-xl bg-red-500  dark:bg-red-800  dark:hover:bg-red-900  hover:bg-red-600  dark:shadow-red-800 shadow-red-200">
                            Resetează Tot
                        </button>
                    </div>
                    <a href="/pages/game-page/password-game-page/password-game.html" id="btn_mergilajoc"
                        class="hidden px-8 py-4 mt-4 text-lg font-bold text-white transition shadow-lg btnMergiLaJoc rounded-xl  bg-green-500 dark:bg-green-800  dark:hover:bg-green-900  hover:bg-green-600 dark:shadow-green-800  shadow-green-200">
                        Mergi la joc</a>
                    <p id="mesajEroare" class="hidden mt-4 font-semibold text-center "></p>
                </div>
            </div>
        </div>
    </div>













    <!-- ------------------------------ ------------------------------------ -->
    <!-- ------------------------------Scripturi-------------------------------- -->
    <!-- ------------------------------------------------------------------------------->

    <!-- ---------------loading screen-------------- -->
    <script src="/assets/js/loading-srean.js"></script>


    <!-- ----------------Crearea jocului----------------- -->
    <script type="module" src="/assets/js/modules/teachers/teachers.password.js"></script>

    <!-- ----------------Scriptul care salveaza istoricul de creare a jocului------------------ -->
    <script type="module" src="/assets/js/game-service/teachers-create-game-password.js"></script>


    <!-- ---------------autentificat ca profesor-------------- -->
    <script type="module" src="/assets/js/dashboard/autentficat-profesor.js"></script>


    <!-- ---------------header / footer-------------- -->
    <script src="/assets/js/materialHTML/materialHTML.js"></script>


    <!-- ---------------dashboard-------------- -->
    <script type="module" src="/assets/js/dashboard/student-dashboard.js"></script>

</body>

</html>
