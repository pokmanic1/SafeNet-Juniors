<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creare Cont</title>
 
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class=" bg-gray-100">

    <header class="flex justify-between items-center px-12 py-6 shadow-sm">
        <div class="flex items-center gap-2">
            <img class=" w-24" src="./img/image-removebg-preview.png" alt="Logo">
        </div>

        <nav class="space-x-8 text-gray-700 font-medium">
            <a href="./assessment.html">Assasment</a>
            <a href="./games.html">Jocuri</a>
            <a href="../index.html">Acasa</a>
        </nav>

        <div class="space-x-6 text-gray-700 font-medium">
            
            <a href="#">Inregistreaza-te</a>
        </div>
    </header>
    <!-- ------------------------------------------------ -->


    <div class="flex min-h-screen ml-[100px]">

        <div class="w-700px flex items-center justify-center">
            <img class="w-[500px]" src="../assets/img/image-removebg-preview (3).png" alt="">
        </div>

        <div class="flex items-center justify-center">
            <!-- ------------------------------------------------ -->
            <div class="ml-[100px] ">
                <div class="flex justify-start">
                    <h1 class="text-4xl font-semibold text-gray-800 mb-4 mr-[120px] text-center">
                        Conectare
                    </h1>
                </div>






                <div class="mb-4">
                    <label class="block text-sm text-gray-600 mb-1 mt-6">Email</label>
                    <input type="email" placeholder="Enter your email address" id="loginEmail"
                        class=" shadow-lg shadow-gray-300 w-[600px] h-[50px] px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-gray-400">
                </div>

                <div class="mb-4">
                    <label class="block text-sm text-gray-600 mb-1 mt-6">Parolă</label>
                    <input type="password" placeholder="Enter your password
                    " id="loginPassword"
                        class="w-[600px] h-[50px] shadow-lg shadow-gray-300 px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-gray-400">
                </div>

                <div class="flex items-start gap-2 text-sm text-gray-600 mb-6 mt-6">
                    <input type="checkbox" class="mt-1">
                    <p>
                        By creating an account, I agree to our
                        <span class="underline">Terms of use</span>
                        and
                        <span class="underline">Privacy Policy</span>
                    </p>
                </div>
                <div class="flex justify-center">
                    <button
                        id="loginBtn" class="w-[450px] py-3 bg-gray-400 text-white rounded-full mt-3 font-medium hover:bg-gray-500 transition ">
                        Conectare
                    </button>
                </div>


            </div>

        </div>
    </div>
    <script type="module" src='../assets/js/main.js'></script>
    <script type="module" src='../assets/js/utilizatori.js'></script>
    <script type="module" src="../assets/js/dashboard/student-dashboard.js"></script>
</body>

</html>
