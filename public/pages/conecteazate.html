<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conectează-te</title>

  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="icon" href="/assets/img/Vector.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- <script>
    if (localStorage.getItem("tema") === "dark") {
      document.documentElement.classList.add("dark");
    }
  </script> -->
</head>

<body class="w-full min-w-[375px] transition-colors duration-300 bg-white body  dark:bg-[#31344D] dark:text-white ">
  <!-- ----------------------------------------------- -->
  <!-- ----------------Header----------------------- -->
  <!-- ----------------------------------------------- -->


  <div class="sticky top-0 left-0 z-10 header"></div>
  <!-- ----------------------------------------------- -->
  <!-- ----------------------------------------------- -->
  <!-- ----------------------------------------------- -->


  <div
    class="flex flex-col items-center justify-center min-h-screen px-4 sm:px-6 lg:px-8 ">

    <div class="w-full py-10 mx-auto md:py-0">

      <div class="w-full max-w-xl mx-auto">

        <div class="flex items-center justify-start mx-auto">
          <h1 class="mx-auto mb-4 text-3xl font-semibold text-center text-gray-800 dark:text-white sm:text-4xl">
            Conectare
          </h1>
        </div>

        <div class="mb-4">
          <label class="block mt-6 mb-1 text-sm text-gray-600 dark:text-gray-400">Email</label>
          <input type="email" placeholder="Introdu adresa de email" id="loginEmail"
            class="shadow-lg shadow-gray-300 dark:shadow-none w-full max-w-[600px] mx-auto h-[50px] px-4 py-2 border border-gray-300 dark:border-neutral-700 rounded-lg bg-white dark:bg-neutral-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-gray-400">
        </div>

        <div class="mb-4">
          <label class="block mt-6 mb-1 text-sm text-gray-600 dark:text-gray-400">Parolă</label>
          <input type="password" placeholder="Introdu parola" id="loginPassword"
            class="w-full max-w-[600px] mx-auto h-[50px] shadow-lg shadow-gray-300 dark:shadow-none px-4 py-2 border border-gray-300 dark:border-neutral-700 rounded-lg bg-white dark:bg-neutral-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-gray-400">
        </div>

        <div class="flex items-center gap-2 mt-6 mb-6 text-sm conectare_p ">
          <p class="w-full text-center"></p>
        </div>

        <div class="flex justify-center ">
          <button id="loginBtn" disabled
            class="w-full sm:w-[450px] py-3 bg-gray-200 cursor-pointer text-black border border-white scale-95 hover:scale-105 transition-transform duration-300 ease-in-out rounded-full mt-3 font-medium transition-colors">
            Conectare
          </button>
        </div>

        <script>
          const emailInput = document.getElementById("loginEmail");
          const passwordInput = document.getElementById("loginPassword");
          const loginBtn = document.getElementById("loginBtn");

          function checkInputs() {
            if (emailInput.value.trim() !== "" && passwordInput.value.trim() !== "") {
              loginBtn.disabled = false;
              loginBtn.classList.remove('bg-gray-200', 'text-black');
              loginBtn.classList.add('bg-gray-900', 'text-white');
            } else {
              loginBtn.disabled = true;
              loginBtn.classList.remove('bg-gray-900', 'text-white');
              loginBtn.classList.add('bg-gray-200', 'text-black');

            }
          }

          emailInput.addEventListener("input", checkInputs);
          passwordInput.addEventListener("input", checkInputs);
        </script>
      </div>
    </div>
  </div>
  <!-- ----------------------------------------------- -->
  <!-- --------------Footer---------------------- -->
  <!-- ----------------------------------------------- -->


  <div class="footer"></div>






  <!-- ------------------------------ ------------------------------------ -->
  <!-- ------------------------------Scripturi-------------------------------- -->
  <!-- ------------------------------------------------------------------------------->
  <!-- ---------------loading screen-------------- -->
  <script src="/assets/js/loading-srean.js"></script>


  <!-- ---------------header / footer-------------- -->
  <script src="/assets/js/materialHTML/materialHTML.js"></script>


  <!-- ---------------gestionarea conectari si inregistrarii -------------- -->
  <script type="module" src='/assets/js/main.js'></script>
  

  <!-- ---------------Scriptul care ascunde ancora conectare din header-------------- -->
  <script>
    const conectM = document.querySelector('#ConecteazataID_M');
    const conect = document.querySelector('#ConecteazataID');

    if (conect && conectM) {
      //console.log("paginile de conectare sunt");
      conect.classList.add('hidden');
      conectM.classList.add('hidden');
    } else {
      //console.log("paginile de conectare NU sunt");
    }
  </script>

</body>

</html>
