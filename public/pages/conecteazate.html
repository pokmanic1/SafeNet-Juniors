<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-gray-100 ">

  <header class="w-full sticky top-0 left-0 z-10 bg-white border-[1px] border-b border-gray-300">
    <div class="mx-[10px] md:mx-[30px] lg:mx-[40px] max-w-full px-6 py-3 flex items-center justify-between">


      <a href="../index.html" class="flex items-center gap-3">
        <img class="object-contain w-20" src="../assets/img/Logo.svg" alt="SafeNet Junior">
      </a>


      <nav class="absolute items-center hidden gap-12 font-semibold transform -translate-x-1/2 md:flex left-1/2">
        <a class="hover:text-gray-700" href="./games.html">Jocuri</a>
        <a class="hover:text-gray-700" href="./assessment.html">Teste</a>
      </nav>


      <div class="items-center hidden gap-10 font-semibold md:flex">

        <a id="InregistreazataID" class="hover:text-gray-700" href="./inregistreazate.html">
          Înregistrare
        </a>
      </div>


      <button id="menuBtn"
        class="inline-flex items-center justify-center p-2 text-gray-900 transition md:hidden rounded-xl hover:bg-gray-100"
        aria-label="Deschide meniul" aria-controls="mobileMenu" aria-expanded="false">


        <svg id="iconOpen" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>


        <svg id="iconClose" xmlns="http://www.w3.org/2000/svg" class="hidden w-6 h-6" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>


    <div id="mobileMenu" class="hidden bg-white border-t border-gray-200 md:hidden">
      <div class="px-4 py-4 mx-auto space-y-3 font-semibold max-w-7xl sm:px-6">

        <a class="block py-2 hover:text-gray-700" href="./games.html">Jocuri</a>
        <a class="block py-2 hover:text-gray-700" href="./assessment.html">Teste</a>

        <div class="h-px my-2 bg-gray-200"></div>

        <a id="InregistreazataID_M" class="block py-2 hover:text-gray-700" href="./inregistreazate.html">
          Înregistrare
        </a>
      </div>
    </div>
  </header>
  <!-- ----------------------------------------------- -->
  <!-- ----------------------------------------------- -->
  <!-- ----------------------------------------------- -->


  <div class="flex flex-col items-center justify-center min-h-screen px-4 sm:px-6 lg:px-8 bg-gray-50">


    <div class="w-full py-10 mx-auto md:py-0">

      <div class="w-full max-w-xl mx-auto">

        <div class="flex items-center justify-start mx-auto">
          <h1 class="mx-auto mb-4 text-3xl font-semibold text-center text-gray-800 sm:text-4xl">
            Conectare
          </h1>
        </div>

        <div class="mb-4">
          <label class="block mt-6 mb-1 text-sm text-gray-600">Email</label>
          <input type="email" placeholder="Enter your email address" id="loginEmail"
            class="shadow-lg shadow-gray-300 w-full max-w-[600px] mx-auto h-[50px] px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-gray-400">

        </div>

        <div class="mb-4">
          <label class="block mt-6 mb-1 text-sm text-gray-600">Parolă</label>
          <input type="password" placeholder="Enter your password" id="loginPassword"
            class="w-full max-w-[600px] mx-auto h-[50px] shadow-lg shadow-gray-300 px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-gray-400">

        </div>

        <div class="flex items-center gap-2 mt-6 mb-6 text-sm conectare_p ">
          <p class="w-full text-center"></p>
        </div>

        <div class="flex justify-center ">
          <button id="loginBtn" class="w-full sm:w-[450px] py-3 bg-gray-400 text-white rounded-full mt-3 font-medium  ">
            Conectare
          </button>
        </div>
        <script>
          const emailInput = document.getElementById("loginEmail");
          const passwordInput = document.getElementById("loginPassword");
          const loginBtn = document.getElementById("loginBtn");

          function checkInputs() {
            if (emailInput.value.trim() !== "" && passwordInput.value.trim() !== "") {
              loginBtn.disabled = false; loginBtn.classList.remove('bg-gray-400'); loginBtn.classList.add('bg-gray-900')
            } else {
              loginBtn.disabled = true;
            }
          }

          emailInput.addEventListener("input", checkInputs);
          passwordInput.addEventListener("input", checkInputs);
        </script>
      </div>
    </div>
  </div>




  <!-- ----------------------------------------------- -->
  <!-- ----------------------------------------------- -->
  <!-- ----------------------------------------------- -->




  <div class="footer"></div>

  <!-- ----------------------------------------------- -->
  <!-- ----------------------------------------------- -->
  <!-- ----------------------------------------------- -->


  <!-- ---------------header / footer-------------- -->

  <script type="module" src='../assets/js/main.js'></script>
  <script type="module" src='../assets/js/utilizatori.js'></script>

</body>

</html>
